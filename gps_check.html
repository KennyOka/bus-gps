<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>バス停GPS検証</title>
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="./manifest.webmanifest">
<!-- iOS ホーム画面追加(全画面) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GPS検証">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --bg:#14171c; --panel:#1c2029; --panel-2:#232833; --line:#2e3440;
    --ink:#eef0f4; --ink-dim:#8a91a3; --ink-faint:#565d6d;
    --hit:#35d68a; --near:#f0b93d; --far:#4a5160;
    --mono:'DejaVu Sans Mono','Courier New',ui-monospace,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans);}
  body{display:flex; flex-direction:column; min-height:100vh; transition:background .3s ease;
       padding-top:env(safe-area-inset-top);}
  body.hit{ background:#0d2b1e; }

  .topbar{ padding:12px 16px 10px; border-bottom:1px solid var(--line); }
  .row{ display:flex; align-items:center; gap:8px; }
  .title{ font-size:14px; font-weight:700; flex:1; }
  .gps-badge{ font-family:var(--mono); font-size:11px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--ink-faint); }
  .dot.ok{ background:var(--hit); } .dot.acq{ background:var(--near); animation:pulse 1s infinite; } .dot.err{ background:#ef5350; }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .data-bar{ margin-top:9px; display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:8px 10px; }
  .data-status{ flex:1; font-size:11.5px; color:var(--ink-dim); line-height:1.4; }
  .data-status.loaded{ color:var(--hit); }
  .data-bar button{ background:var(--panel-2); border:1px solid var(--line); color:var(--ink); font-size:11px; font-weight:600; border-radius:7px; padding:7px 9px; white-space:nowrap; }

  .hero{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px 20px; text-align:center; }
  .hero-label{ font-size:11px; letter-spacing:.14em; color:var(--ink-dim); text-transform:uppercase; margin-bottom:8px; }
  .hero-name{ font-size:40px; font-weight:800; line-height:1.15; word-break:break-word; }
  .hero-name.hit{ color:var(--hit); }
  .hero-dist{ margin-top:12px; font-family:var(--mono); font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; }
  .hero-dist .u{ font-size:16px; color:var(--ink-dim); margin-left:4px; }
  .hero-sub{ margin-top:10px; font-size:13px; color:var(--ink-dim); min-height:18px; }
  .hero-badge{ margin-top:14px; font-size:15px; font-weight:800; letter-spacing:.08em; padding:7px 20px; border-radius:20px;
               background:var(--panel-2); color:var(--ink-dim); border:1px solid var(--line); }
  .hero-badge.hit{ background:var(--hit); color:#062f1c; border-color:var(--hit); }

  .near-list{ padding:0 16px 6px; }
  .near-list .nl-title{ font-size:10px; color:var(--ink-faint); letter-spacing:.06em; margin:2px 0 6px; }
  .nl-row{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-dim); padding:3px 0; border-bottom:1px dotted var(--line); }
  .nl-row .d{ font-family:var(--mono); }

  .radius-bar{ padding:8px 16px; display:flex; align-items:center; gap:10px; border-top:1px solid var(--line); }
  .radius-bar label{ font-size:11px; color:var(--ink-dim); white-space:nowrap; }
  .radius-bar input[type=range]{ flex:1; accent-color:var(--hit); }
  .radius-val{ font-family:var(--mono); font-size:13px; min-width:52px; text-align:right; }

  .log-wrap{ max-height:34vh; overflow-y:auto; padding:6px 16px 4px; border-top:1px solid var(--line); }
  .log-head{ display:flex; justify-content:space-between; align-items:center; margin:6px 0; }
  .log-title{ font-size:11px; color:var(--ink-dim); }
  .log-head button{ font-size:10.5px; background:none; border:1px solid var(--line); color:var(--ink-dim); border-radius:6px; padding:4px 8px; margin-left:6px; }
  .log-row{ display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px; }
  .log-idx{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); width:22px; }
  .log-name{ flex:1; font-size:13px; font-weight:600; }
  .log-meta{ font-family:var(--mono); font-size:11px; color:var(--ink-dim); text-align:right; }
  .log-empty{ font-size:12px; color:var(--ink-faint); text-align:center; padding:14px; }

  .footer{ display:flex; gap:8px; padding:10px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  .footer button{ flex:1; padding:11px 8px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); font-size:12px; font-weight:600; }
  .footer button.warn{ color:#ef8f8f; border-color:rgba(239,83,80,.35); background:none; flex:.7; }
  input[type=file]{ display:none; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="row">
      <div class="title">🛰️ バス停GPS検証</div>
      <div class="gps-badge"><span class="dot" id="gpsDot"></span><span id="gpsText">GPS待機</span></div>
    </div>
    <div class="data-bar">
      <div class="data-status" id="dataStatus">バス停データ未読込</div>
      <button id="syncBtn">🌐 同期</button>
      <button id="loadBtn">📂 読込</button>
      <input type="file" id="fileInput" accept="application/json,.json">
    </div>
  </div>

  <div class="hero">
    <div class="hero-label">最寄りのバス停</div>
    <div class="hero-name" id="heroName">—</div>
    <div class="hero-dist" id="heroDist">--<span class="u">m</span></div>
    <div class="hero-sub" id="heroSub">データを読み込み、GPSを許可してください</div>
    <div class="hero-badge" id="heroBadge">停止中</div>
  </div>

  <div class="near-list">
    <div class="nl-title">近い順(上位3件)</div>
    <div id="nearList"></div>
  </div>

  <div class="radius-bar">
    <label>判定半径</label>
    <input type="range" id="radius" min="10" max="120" step="5" value="40">
    <div class="radius-val" id="radiusVal">40m</div>
  </div>

  <div class="log-wrap">
    <div class="log-head">
      <div class="log-title" id="logTitle">通過ログ: 0件</div>
      <div>
        <button id="csvBtn">CSV書出</button>
        <button id="clearLogBtn">ログ消去</button>
      </div>
    </div>
    <div id="logList"><div class="log-empty">まだ通過したバス停はありません</div></div>
  </div>

  <div class="footer">
    <button id="startBtn" class="primary" style="background:var(--ink);color:var(--bg);">GPS開始</button>
    <button id="markBtn">📍 現在地を仮登録</button>
    <button id="clearDataBtn" class="warn">データ消去</button>
  </div>

<script>
(function(){
  const LS_STOPS = 'gpscheck_stops';
  const LS_RADIUS = 'gpscheck_radius';
  const LS_URL = 'gpscheck_syncurl';

  let stops = [];      // {name, lat, lng} 全件メモリ常駐
  let radiusM = parseInt(localStorage.getItem(LS_RADIUS) || '40', 10);
  let watchId = null;
  let insideStop = null;   // 現在「判定半径内」に居るバス停
  let insideMin = Infinity;
  let passLog = [];        // {name, lat, lng, minDist, time}

  const els = {
    gpsDot: document.getElementById('gpsDot'),
    gpsText: document.getElementById('gpsText'),
    dataStatus: document.getElementById('dataStatus'),
    syncBtn: document.getElementById('syncBtn'),
    loadBtn: document.getElementById('loadBtn'),
    fileInput: document.getElementById('fileInput'),
    heroName: document.getElementById('heroName'),
    heroDist: document.getElementById('heroDist'),
    heroSub: document.getElementById('heroSub'),
    heroBadge: document.getElementById('heroBadge'),
    nearList: document.getElementById('nearList'),
    radius: document.getElementById('radius'),
    radiusVal: document.getElementById('radiusVal'),
    logTitle: document.getElementById('logTitle'),
    logList: document.getElementById('logList'),
    csvBtn: document.getElementById('csvBtn'),
    clearLogBtn: document.getElementById('clearLogBtn'),
    startBtn: document.getElementById('startBtn'),
    markBtn: document.getElementById('markBtn'),
    clearDataBtn: document.getElementById('clearDataBtn'),
  };

  // ---- 距離(ハーバサイン) ----
  const R = 6371000;
  function dist(lat1,lng1,lat2,lng2){
    const toRad=d=>d*Math.PI/180;
    const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
    const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  // ---- データ読み込み(全件を一度だけメモリ+localStorageへ。運用中はDB/通信アクセスなし) ----
  function normalize(data){
    let arr = Array.isArray(data) ? data
            : Array.isArray(data.stops) ? data.stops
            : Array.isArray(data.locations) ? data.locations
            : [];
    const out=[];
    arr.forEach(s=>{
      const lat = s.lat ?? s.latitude ?? s.Lat ?? s.緯度;
      const lng = s.lng ?? s.lon ?? s.longitude ?? s.Lng ?? s.経度;
      const name = s.name ?? s.stop_name ?? s.名称 ?? s.バス停名 ?? '';
      if (typeof lat==='number' && typeof lng==='number' && isFinite(lat) && isFinite(lng)){
        out.push({ name:String(name||'(無名)'), lat, lng });
      }
    });
    return out;
  }
  function setStops(arr, source){
    stops = arr;
    localStorage.setItem(LS_STOPS, JSON.stringify(stops));
    els.dataStatus.textContent = `バス停 ${stops.length}件 読込済み` + (source?` (${source})`:'') ;
    els.dataStatus.classList.toggle('loaded', stops.length>0);
  }
  els.loadBtn.addEventListener('click', ()=> els.fileInput.click());
  els.fileInput.addEventListener('change', (e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const arr=normalize(JSON.parse(reader.result));
        if(!arr.length){ els.dataStatus.textContent='有効な緯度経度が見つかりません(lat/lng を確認)'; return; }
        setStops(arr, file.name);
      }catch(err){ els.dataStatus.textContent='JSONの読み込みに失敗しました'; }
    };
    reader.readAsText(file);
    e.target.value='';
  });

  // ---- URLから同期(APIを一度だけ取得→キャッシュ。以降はオフライン動作) ----
  async function syncFromUrl(askIfNone){
    let url = localStorage.getItem(LS_URL);
    if(!url && askIfNone){
      url = prompt('同期URL(busstops.php のURL)を入力', 'https://');
      if(!url || url==='https://') return;
    }
    if(!url) return;
    els.dataStatus.textContent = '同期中…';
    try{
      const resp = await fetch(url, { cache:'no-store' });
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const arr = normalize(await resp.json());
      if(!arr.length){ els.dataStatus.textContent = '同期結果に有効な座標が見つかりません'; return; }
      localStorage.setItem(LS_URL, url);
      setStops(arr, 'URL同期');
    }catch(err){
      els.dataStatus.textContent = '同期失敗: ' + err.message + '（オフライン時は保存データで動作）';
    }
  }
  els.syncBtn.addEventListener('click', ()=> syncFromUrl(true));

  // ---- 判定半径 ----
  els.radius.value = radiusM; els.radiusVal.textContent = radiusM+'m';
  els.radius.addEventListener('input', ()=>{
    radiusM = parseInt(els.radius.value,10);
    els.radiusVal.textContent = radiusM+'m';
    localStorage.setItem(LS_RADIUS, String(radiusM));
  });

  // ---- GPS ----
  function startGps(){
    if(!navigator.geolocation){ els.gpsText.textContent='GPS非対応'; els.gpsDot.className='dot err'; return; }
    els.gpsDot.className='dot acq'; els.gpsText.textContent='取得中…';
    els.startBtn.textContent='GPS停止';
    watchId = navigator.geolocation.watchPosition(onPos, onErr,
      { enableHighAccuracy:true, maximumAge:1000, timeout:15000 });
  }
  function stopGps(){
    if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
    els.startBtn.textContent='GPS開始';
    els.gpsDot.className='dot'; els.gpsText.textContent='停止中';
  }
  els.startBtn.addEventListener('click', ()=> watchId===null ? startGps() : stopGps());

  function onErr(err){ els.gpsDot.className='dot err'; els.gpsText.textContent='エラー: '+err.message; }

  function onPos(pos){
    const {latitude:lat, longitude:lng, accuracy} = pos.coords;
    els.gpsDot.className='dot ok';
    els.gpsText.textContent = `精度±${Math.round(accuracy)}m`;

    if(!stops.length){
      els.heroSub.textContent='バス停データを読み込んでください';
      return;
    }

    // 全件との距離を計算(メモリ内のみ)
    const ranked = stops.map(s=>({s, d:dist(lat,lng,s.lat,s.lng)})).sort((a,b)=>a.d-b.d);
    const nearest = ranked[0];

    // 最寄り表示
    els.heroName.textContent = nearest.s.name;
    els.heroDist.innerHTML = `${Math.round(nearest.d)}<span class="u">m</span>`;

    // 半径内判定(enter/exit)
    const within = nearest.d <= radiusM;
    if (insideStop === null){
      if (within){ enterStop(nearest.s, nearest.d, lat, lng); }
    } else {
      const dIn = dist(lat,lng, insideStop.lat, insideStop.lng);
      if (dIn <= radiusM){ insideMin = Math.min(insideMin, dIn); if(passLog[0]) passLog[0].minDist=Math.round(insideMin); renderLog(); }
      else { insideStop=null; insideMin=Infinity; }
    }

    const hit = insideStop !== null;
    document.body.classList.toggle('hit', hit);
    els.heroName.classList.toggle('hit', hit);
    els.heroBadge.classList.toggle('hit', hit);
    els.heroBadge.textContent = hit ? '● 通過中' : '走行中';
    els.heroSub.textContent = hit
      ? `${insideStop.name} を通過中(最接近 ${Math.round(insideMin)}m)`
      : `最寄りまで ${Math.round(nearest.d)}m ・ 半径${radiusM}m以内で反応`;

    // 近い順3件
    els.nearList.innerHTML='';
    ranked.slice(0,3).forEach(r=>{
      const row=document.createElement('div'); row.className='nl-row';
      row.innerHTML=`<span>${r.s.name}</span><span class="d">${Math.round(r.d)}m</span>`;
      els.nearList.appendChild(row);
    });
  }

  function enterStop(s, d, lat, lng){
    insideStop = s; insideMin = d;
    passLog.unshift({ name:s.name, lat, lng, minDist:Math.round(d), time:new Date() });
    if(navigator.vibrate) navigator.vibrate(120);
    renderLog();
  }

  function renderLog(){
    els.logTitle.textContent = `通過ログ: ${passLog.length}件`;
    if(!passLog.length){ els.logList.innerHTML='<div class="log-empty">まだ通過したバス停はありません</div>'; return; }
    els.logList.innerHTML='';
    passLog.forEach((e,i)=>{
      const row=document.createElement('div'); row.className='log-row';
      const t=e.time.toLocaleTimeString('ja-JP',{hour12:false});
      row.innerHTML=`<span class="log-idx">${passLog.length-i}</span>`+
        `<span class="log-name">${e.name}</span>`+
        `<span class="log-meta">最接近${e.minDist}m<br>${t}</span>`;
      els.logList.appendChild(row);
    });
  }

  // ---- 現在地を仮登録(データが無くても通過判定の仕組みを検証できる) ----
  els.markBtn.addEventListener('click', ()=>{
    if(!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(pos=>{
      const name = prompt('仮登録するバス停名', '仮'+(stops.length+1));
      if(name===null) return;
      const s={ name:name||('仮'+(stops.length+1)), lat:pos.coords.latitude, lng:pos.coords.longitude };
      stops.push(s);
      setStops(stops, '仮登録追加');
    }, err=> alert('現在地取得失敗: '+err.message), { enableHighAccuracy:true, timeout:15000 });
  });

  // ---- CSV書き出し(検証結果の記録用) ----
  els.csvBtn.addEventListener('click', ()=>{
    if(!passLog.length){ alert('ログがありません'); return; }
    const rows=[['通過順','バス停名','最接近距離(m)','時刻','緯度','経度']];
    passLog.slice().reverse().forEach((e,i)=> rows.push([i+1, e.name, e.minDist, e.time.toLocaleTimeString('ja-JP',{hour12:false}), e.lat.toFixed(6), e.lng.toFixed(6)]));
    const csv='﻿'+rows.map(r=>r.join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='gps_check_log.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  });
  els.clearLogBtn.addEventListener('click', ()=>{ passLog=[]; insideStop=null; insideMin=Infinity; renderLog(); });
  els.clearDataBtn.addEventListener('click', ()=>{
    if(!confirm('読み込んだバス停データを消去します(通過ログは残ります)。よろしいですか?')) return;
    stops=[]; localStorage.removeItem(LS_STOPS);
    els.dataStatus.textContent='バス停データ未読込'; els.dataStatus.classList.remove('loaded');
  });

  // ---- 起動時: localStorage から全件復元(通信なし) ----
  (function boot(){
    try{
      const saved=localStorage.getItem(LS_STOPS);
      if(saved){ const arr=JSON.parse(saved); if(Array.isArray(arr)&&arr.length){ setStops(arr,'保存データ'); } }
    }catch(e){}
    renderLog();
  })();

  // ---- Service Worker 登録(オフライン・低通信のPWA化) ----
  if('serviceWorker' in navigator && location.protocol==='https:'){
    window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
