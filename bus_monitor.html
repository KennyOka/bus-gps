<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>しまバスドラサポ</title>
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="./manifest_monitor.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ドラサポ">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --bg:#14171c; --panel:#1c2029; --panel-2:#232833; --line:#2e3440;
    --ink:#eef0f4; --ink-dim:#8a91a3; --ink-faint:#565d6d;
    --ok:#35d68a; --early:#ef4444; --neutral:#4da3ff; --late-y:#f0b93d; --late-o:#ff8c3a;
    --mono:'DejaVu Sans Mono','Courier New',ui-monospace,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);}
  /* 自然フロー+ページスクロール。下部の副操作は画面外にはみ出してよい */
  body{min-height:100dvh; transition:background .3s ease;
       padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}
  body.state-early{ animation:flashRed .9s infinite; }
  @keyframes flashRed{ 0%,100%{background:#3a0d0d;} 50%{background:#8f1d1d;} }
  body.state-ok{ background:#0d2b1e; }
  body.state-late-y{ background:#2e2606; }
  body.state-late-o{ background:#331a06; }

  /* オープニング(1.5秒) */
  #splash{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 38%, #143a72, #0a1020 72%); overflow:hidden; }
  #splash.hide{ opacity:0; visibility:hidden; transition:opacity .5s ease, visibility .5s; }
  #splash::before{ content:""; position:absolute; top:-60%; left:-30%; width:60%; height:220%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); transform:rotate(18deg);
    animation:sweep 1.4s ease-in-out .3s; }
  @keyframes sweep{ 0%{ left:-40%; } 100%{ left:120%; } }
  .splash-inner{ text-align:center; }
  .splash-logo{ font-size:76px; animation:logoIn 1s cubic-bezier(.2,1.4,.35,1) both; }
  .splash-title{ font-size:46px; font-weight:900; letter-spacing:.1em; margin-top:4px;
    background:linear-gradient(90deg,#fff,#8fd0ff,#fff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:#fff;
    animation:titleIn .8s .35s both; }
  .splash-sub{ font-size:14px; color:#9fb6d8; margin-top:10px; letter-spacing:.14em; animation:titleIn .8s .6s both; }
  @keyframes logoIn{ 0%{ transform:scale(.2) rotate(-25deg); opacity:0; } 100%{ transform:scale(1) rotate(0); opacity:1; } }
  @keyframes titleIn{ 0%{ transform:translateY(14px); opacity:0; } 100%{ transform:translateY(0); opacity:1; } }

  .screen{ display:none; }
  .screen.active{ display:block; }

  .topbar{ padding:12px 16px 10px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; }
  .title{ font-size:15px; font-weight:700; }
  .clock{ font-family:var(--mono); font-size:13px; color:var(--ink-dim); font-variant-numeric:tabular-nums; }

  /* setup */
  .form{ padding:18px 18px; display:flex; flex-direction:column; gap:16px; }
  .field label{ font-size:12px; color:var(--ink-dim); display:block; margin-bottom:6px; }
  .field input[type=date], .field input[type=number]{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    border-radius:9px; padding:12px; font-size:17px; font-family:var(--sans);
  }
  .seg{ display:flex; gap:8px; }
  .seg button{ flex:1; padding:12px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink-dim); font-size:14px; font-weight:600; }
  .seg button.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .big-btn{ padding:15px; border-radius:11px; border:none; background:var(--ink); color:var(--bg); font-size:16px; font-weight:700; }
  .msg{ font-size:12.5px; color:var(--ink-faint); text-align:center; min-height:16px; padding:0 16px; }
  .msg.err{ color:var(--early); }

  /* course list */
  .list-head{ padding:10px 16px; font-size:12px; color:var(--ink-dim); border-bottom:1px solid var(--line); }
  .list{ flex:1; overflow-y:auto; padding:10px 14px 16px; }
  .course{ width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:9px; display:flex; align-items:center; gap:12px; color:var(--ink); }
  .course:disabled{ opacity:.5; }
  .course .seqn{ width:30px; height:30px; border-radius:50%; background:var(--panel-2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink-dim); flex-shrink:0; }
  .course .body{ flex:1; min-width:0; }
  .course .route{ font-size:15px; font-weight:600; }
  .course .sub{ font-size:11px; color:var(--ink-dim); margin-top:3px; }
  .course .time{ font-family:var(--mono); font-size:17px; font-weight:700; }
  .badge{ font-size:9.5px; padding:1px 6px; border-radius:5px; background:var(--panel-2); color:var(--ink-dim); margin-left:6px; }
  .badge.pay{ background:#3a2d0d; color:var(--ok); }

  /* monitor */
  .mon{ display:block; }
  .mon-top{ padding:8px 16px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .mon-course{ font-size:18px; font-weight:800; line-height:1.15; }
  .mon-sub{ font-size:15px; font-weight:600; color:var(--ink-dim); margin-top:3px; }
  .mon-zone{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 16px 6px; text-align:center; }
  .state-tag{ font-size:19px; font-weight:800; letter-spacing:.06em; padding:6px 18px; border-radius:20px; margin-bottom:6px; background:var(--panel-2); color:var(--ink-dim); border:1px solid var(--line); }
  .state-tag.early{ background:var(--early); color:#fff; border-color:var(--early); }
  .state-tag.ok{ background:var(--ok); color:#062f1c; border-color:var(--ok); }
  .state-tag.late-y{ background:var(--late-y); color:#241c00; border-color:var(--late-y); }
  .state-tag.late-o{ background:var(--late-o); color:#2a1400; border-color:var(--late-o); }
  .diff-label{ font-size:12px; letter-spacing:.14em; color:var(--ink-dim); text-transform:uppercase; margin-bottom:6px; }
  .diff{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:72px; font-weight:800; line-height:1; }
  body.state-early .diff{ color:#fff; }
  .diff.ok{ color:var(--ok); } .diff.early{ color:#fff; } .diff.appr{ color:var(--ink); }
  .diff.late-y{ color:var(--late-y); } .diff.late-o{ color:var(--late-o); }
  .caption{ margin-top:12px; font-size:16px; color:var(--ink-dim); }
  body.state-early .caption{ color:rgba(255,255,255,.9); }
  .next-prev{ margin-top:10px; font-size:26px; font-weight:700; color:var(--ink); max-width:100%; white-space:nowrap; overflow:hidden; }
  .target-card{ margin-top:12px; width:100%; max-width:460px; background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tc-left{ flex:1; min-width:0; }
  .tc-lbl{ font-size:11px; color:var(--ink-dim); }
  .target-name{ width:4.4em; font-size:44px; font-weight:800; line-height:1.1; white-space:nowrap; overflow:hidden; }
  .tn-text{ display:inline-block; will-change:transform; }
  .tn-text.scroll{ animation: tnMarquee var(--dur,5s) linear infinite alternate; }
  @keyframes tnMarquee{ from{ transform:translateX(0); } to{ transform:translateX(var(--shift,0)); } }
  .target-dist{ font-size:15px; color:var(--ink-dim); margin-top:4px; text-align:left; }
  .target-eta{ text-align:right; flex-shrink:0; }
  .target-eta .t{ font-family:var(--mono); font-size:26px; font-weight:700; white-space:nowrap; }
  .target-eta .l{ font-size:10px; color:var(--ink-dim); }

  .rail{ display:flex; gap:3px; padding:6px 16px 2px; flex-wrap:wrap; }
  .rdot{ width:9px; height:9px; border-radius:50%; background:var(--panel-2); border:1px solid var(--ink-faint); }
  .rdot.passed{ background:var(--ink-faint); }
  .rdot.cur{ background:var(--ink); border-color:var(--ink); transform:scale(1.3); }
  .rail-txt{ font-size:11px; color:var(--ink-faint); padding:2px 16px 8px; }
  .gps-note{ font-size:11px; color:var(--ink-faint); text-align:center; padding:0 16px 6px; }

  .controls{ display:flex; gap:6px; align-items:stretch; padding:10px 12px; }
  .controls.primary{ border-top:1px solid var(--line); }
  .controls button{ flex:1; padding:14px 6px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); font-size:14px; font-weight:700; white-space:nowrap; }
  .controls .adv{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .controls.secondary button{ font-size:13px; font-weight:600; padding:12px 6px; }
  .radius-sel{ flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:12px 6px; font-size:14px; font-family:var(--sans); text-align:center; }
  .sim{ display:flex; flex-direction:column; gap:8px; width:100%; padding:6px 16px 4px; }
  .sim-line{ display:flex; align-items:center; gap:10px; }
  .sim-line .sl{ font-size:12px; color:var(--ink-dim); white-space:nowrap; }
  .sim-line input[type=range]{ flex:1; min-width:0; accent-color:var(--neutral); height:30px; }
  .sim-off-btn{ width:100%; padding:11px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); font-size:13px; font-weight:600; }
</style>
</head>
<body>

  <!-- オープニング(⑨) -->
  <div id="splash"><div class="splash-inner">
    <div class="splash-logo">🚌</div>
    <div class="splash-title">ドラサポ</div>
    <div class="splash-sub">しまバス ドライバーズサポート</div>
  </div></div>

  <!-- ===== 画面1: 設定 ===== -->
  <div class="screen active" id="scSetup">
    <div class="topbar"><div class="title">🚌 しまバスドラサポ</div><div class="clock" id="clock1">--:--:--</div></div>
    <div class="form">
      <div class="field">
        <label>日付</label>
        <input type="date" id="dateInput">
      </div>
      <div class="field">
        <label>ダイヤ種別(日付から自動判定・祝日は手動で切替)</label>
        <div class="seg">
          <button id="dtWeekday" class="active">平日</button>
          <button id="dtHoliday">土日祝</button>
        </div>
      </div>
      <div class="field">
        <label>ダイヤ番号</label>
        <input type="number" id="diaInput" inputmode="numeric" placeholder="例: 31">
      </div>
      <button class="big-btn" id="loadCoursesBtn">コース一覧を取得</button>
      <div class="msg" id="setupMsg"></div>
    </div>
  </div>

  <!-- ===== 画面2: コース一覧 ===== -->
  <div class="screen" id="scList">
    <div class="topbar"><div class="title">コースを選択</div><div class="clock" id="clock2">--:--:--</div></div>
    <div class="list-head" id="listHead">—</div>
    <div class="list" id="courseList"></div>
    <div class="controls"><button class="grow" id="backToSetup">← 設定へ戻る</button></div>
  </div>

  <!-- ===== 画面3: モニター ===== -->
  <div class="screen" id="scMon">
    <div class="mon">
      <div class="mon-top">
        <div><div class="mon-course" id="monCourse">—</div><div class="mon-sub" id="monSub"></div></div>
        <div class="clock" id="clock3">--:--:--</div>
      </div>
      <div class="mon-zone">
        <div class="state-tag" id="stateTag">運行前</div>
        <div class="diff-label">現在時刻とダイヤ定刻の差</div>
        <div class="diff appr" id="diff">--:--</div>
        <div class="caption" id="caption">GPSを開始してください</div>
        <div class="target-card">
          <div class="tc-left"><div class="target-name" id="targetName"><span class="tn-text" id="tnText">—</span></div><div class="target-dist" id="targetDist"></div></div>
          <div class="target-eta"><div class="t" id="targetEta">--:--</div></div>
        </div>
        <div class="next-prev" id="nextPrev"></div>
      </div>
      <div class="rail" id="rail"></div>
      <div class="rail-txt" id="railTxt"></div>
      <div class="gps-note" id="gpsNote"></div>
      <div class="controls primary">
        <button id="monBack">コース</button>
        <button id="startBtn" class="grow adv">開始</button>
        <button id="prevBtn">◀前停</button>
        <button id="nextBtn">次停▶</button>
      </div>
      <div class="controls secondary">
        <button id="modeBtn">デモ</button>
        <select id="radius" class="radius-sel"></select>
        <button id="audioBtn">🔊音ON</button>
        <button id="voiceBtn">女声</button>
      </div>
      <div class="sim" id="simRow" style="display:none;">
        <div class="sim-line">
          <span class="sl">対象停</span>
          <input type="range" id="simStop" min="0" max="0" value="0">
        </div>
        <button class="sim-off-btn" id="simOff">早発-30s（タップで切替）</button>
      </div>
    </div>
  </div>

<script>
(function(){
  // tokyoknock.com 配下なら相対(同一オリジン=CORS不要)、それ以外(GitHub Pages等)は絶対URL
  const API_BASE = (location.origin === 'https://tokyoknock.com') ? 'api/' : 'https://tokyoknock.com/bus/api/';
  let STOP_RADIUS_M = parseInt(lsGet('mon_radius') || '20', 10);   // 既定20m・画面で変更可

  function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
  function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }

  let dayType = 1;
  let courses = [];
  let course = null;      // 選択中コース {dia_course_id, ...}
  let stops = [];         // course_stops [{seq,name,lat,lng,scheduled_time,...}]
  let targetIndex = 0;
  let lastAtStopIndex = -1;
  let watchId = null;
  let mode = 'gps';       // 'gps' | 'demo'
  let simOffset = -30;    // デモ時の秒オフセット(-30早発/+15遅れ 等)
  let lastLat=null, lastLng=null;
  let audioPrimed=false, lastEarlyAnnounce=0, terminalAnnounced=false;
  let audioOn = (lsGet('mon_audio')!=='off');                        // ⑦ 既定ON
  let voiceGender = (lsGet('mon_voice')==='male' ? 'male':'female'); // ⑥
  let jaVoices = [];

  // ---- 音声(iOS Safari: ユーザー操作でunlock。声色/ON-OFF対応) ----
  function loadVoices(){ try{ jaVoices = window.speechSynthesis.getVoices().filter(v=>/ja|JP/i.test(v.lang)); }catch(e){} }
  function pickVoice(){
    if(!jaVoices.length) loadVoices();
    if(!jaVoices.length) return null;
    const male = jaVoices.find(v=>/otoya|hattori|ichiro|male|男/i.test(v.name));
    const female = jaVoices.find(v=>/kyoko|o-?ren|female|女/i.test(v.name));
    return voiceGender==='male' ? (male||jaVoices[0]) : (female || jaVoices.find(v=>v!==male) || jaVoices[0]);
  }
  function primeAudio(){ if(audioPrimed) return; try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; window.speechSynthesis.speak(u); audioPrimed=true; }catch(e){} }
  function speak(text){ if(!audioOn) return; try{ window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; const v=pickVoice(); if(v) u.voice=v; u.rate=1.0; window.speechSynthesis.speak(u); }catch(e){} }
  try{ window.speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); }catch(e){}

  const $ = id => document.getElementById(id);

  // ---- 画面遷移 ----
  function clearStateClasses(){ document.body.classList.remove('state-early','state-ok','state-late-y','state-late-o'); }
  function show(id){ ['scSetup','scList','scMon'].forEach(s=> $(s).classList.toggle('active', s===id)); if(id!=='scMon') clearStateClasses(); }

  // ---- 時計 ----
  function tickClock(){ const t=new Date().toLocaleTimeString('ja-JP',{hour12:false}); $('clock1').textContent=$('clock2').textContent=$('clock3').textContent=t; }
  setInterval(tickClock,1000); tickClock();

  // ---- 距離(ハーバサイン) ----
  const R=6371000;
  function distM(a,b,c,d){ const r=x=>x*Math.PI/180; const dLat=r(c-a),dLng=r(d-b);
    const s=Math.sin(dLat/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLng/2)**2; return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }

  // ---- 日付→ダイヤ種別 ----
  function autoDayType(dstr){ if(!dstr) return 1; const d=new Date(dstr+'T00:00'); const w=d.getDay(); return (w===0||w===6)?2:1; }
  function setDayType(dt){ dayType=dt; $('dtWeekday').classList.toggle('active',dt===1); $('dtHoliday').classList.toggle('active',dt===2); }
  $('dtWeekday').onclick=()=>setDayType(1);
  $('dtHoliday').onclick=()=>setDayType(2);
  (function initDate(){
    const t=new Date(); const iso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
    $('dateInput').value=iso; setDayType(autoDayType(iso));
    const savedDia=lsGet('mon_dia'); if(savedDia) $('diaInput').value=savedDia;
  })();
  $('dateInput').addEventListener('change', e=> setDayType(autoDayType(e.target.value)));

  // ---- コース一覧取得 ----
  $('loadCoursesBtn').addEventListener('click', async ()=>{
    const dia=($('diaInput').value||'').replace(/[^0-9]/g,'');
    if(!dia){ setupMsg('ダイヤ番号を入力してください', true); return; }
    lsSet('mon_dia', dia);
    setupMsg('取得中…', false);
    try{
      const r=await fetch(`${API_BASE}courses.php?dia_no=${dia}&day_type=${dayType}&_=${Date.now()}`, {cache:'no-store'});
      const j=await r.json();
      if(!r.ok || j.error){ setupMsg('取得失敗: '+(j.error||r.status), true); return; }
      if(!j.courses || !j.courses.length){ setupMsg(`ダイヤ ${j.dia_no}(${dayType===1?'平日':'土日祝'})のコースが見つかりません`, true); return; }
      courses=j.courses;
      renderCourses(j);
      show('scList');
    }catch(e){ setupMsg('通信エラー: '+e.message, true); }
  });
  function setupMsg(t,err){ const m=$('setupMsg'); m.textContent=t; m.classList.toggle('err',!!err); }

  function renderCourses(j){
    $('listHead').textContent = `ダイヤ ${j.dia_no} ・ ${dayType===1?'平日':'土日祝'} ・ ${j.count}コース`;
    const wrap=$('courseList'); wrap.innerHTML='';
    const catName={1:'点検',2:'回送',3:'実車',4:'—',5:'清掃'};
    courses.forEach(c=>{
      const btn=document.createElement('button'); btn.className='course';
      const selectable = c.category===3;
      btn.disabled=!selectable;
      btn.innerHTML =
        `<div class="seqn">${c.seq}</div>`+
        `<div class="body"><div class="route">${c.start_place||'—'} → ${c.end_place||'—'}`+
          (c.category!==3?`<span class="badge">${catName[c.category]||c.category}</span>`:'')+
          (c.settlement_flag?`<span class="badge pay">納金</span>`:'')+`</div>`+
          `<div class="sub">系統 ${c.touch_no||'—'}${c.digital_no?' ・ デジタル'+c.digital_no:''}</div></div>`+
        `<div class="time">${c.departure_time||''}</div>`;
      if(selectable) btn.addEventListener('click', ()=> selectCourse(c));
      wrap.appendChild(btn);
    });
  }
  $('backToSetup').onclick=()=>show('scSetup');

  // ---- コース選択→停留所取得→モニター ----
  async function selectCourse(c){
    course=c;
    $('gpsNote').textContent='停留所データを取得中…';
    try{
      const r=await fetch(`${API_BASE}course_stops.php?dia_course_id=${c.dia_course_id}&_=${Date.now()}`, {cache:'no-store'});
      if(!r.ok){ alert('停留所データ取得エラー: HTTP '+r.status); return; }
      let j=null;
      try{ j=await r.json(); }catch(pe){ alert('停留所データの解析に失敗しました(JSONではない応答)。SW更新のため再読み込みしてください'); return; }
      if(!j || j.error){ alert('停留所データ取得エラー: '+((j&&j.error)||'不明')); return; }
      if(!j.stops || !j.stops.length){ alert('このコースには停留所データがありません(count=0)'); return; }
      stops=j.stops;
      targetIndex=0; lastAtStopIndex=-1;
      $('monCourse').textContent=`${c.start_place} → ${c.end_place}`;
      $('monSub').textContent=`${c.departure_time}発 ・ タッチ ${c.touch_no||'—'}${c.digital_no?' ・ デジタル'+c.digital_no:''}`;
      buildRail();
      resetMonUI();
      $('simStop').max=String(stops.length-1); $('simStop').value='0';
      show('scMon');
    }catch(e){ alert('通信エラー: '+e.message); }
  }
  $('monBack').onclick=()=>{ stopGps(); show('scList'); };

  // ---- 定刻(絶対時刻)算出 ----
  function schedDate(stop){ const p=(stop.scheduled_time||'00:00:00').split(':').map(Number); const d=new Date(); d.setHours(p[0]||0,p[1]||0,p[2]||0,0); return d; }
  function fmtSec(sec){ const s=Math.round(sec); const a=Math.abs(s); const m=Math.floor(a/60), ss=a%60; return `${m}:${String(ss).padStart(2,'0')}`; }
  function hhmm(stop){ const p=(stop.scheduled_time||'').split(':'); return p.length>=2?`${p[0]}:${p[1]}`:'--:--'; }

  // ---- 早発判定(現在の壁時計 vs 絶対定刻) ----
  function evaluate(lat,lng,now){
    if(targetIndex>=stops.length) return {state:'finished'};
    const stop=stops[targetIndex];
    const isLast = targetIndex===stops.length-1;
    const remainingSec=(schedDate(stop)-now)/1000;   // >0=定刻前, <=0=定刻以降
    let d=Infinity;
    if(stop.lat!=null && stop.lng!=null && lat!=null) d=distM(lat,lng,stop.lat,stop.lng);
    if(d<=STOP_RADIUS_M){
      lastAtStopIndex=targetIndex;
      if(isLast) return { state:'terminal', stop, remainingSec, d };   // 終点は早発判定せず到着扱い
      if(targetIndex===0 && remainingSec>0) return { state:'waiting', stop, remainingSec, d };  // ⑤ 始発
      return { state: remainingSec>0?'early':'ok', stop, remainingSec, d };
    } else {
      if(lastAtStopIndex===targetIndex){
        if(isLast) return { state:'terminal', stop, remainingSec, d };  // 終点からは進めない
        const nextStop = stops[targetIndex+1];   // ⑧ 発車=半径を外れた → 次を案内
        advance();
        if(nextStop) speak(`次は、${nextStop.name}です`);
        if(targetIndex>=stops.length) return {state:'finished'};
        return evaluate(lat,lng,now);
      }
      return { state:'approaching', stop, remainingSec, d };
    }
  }
  function advance(){ if(targetIndex<stops.length){ targetIndex++; lastAtStopIndex=-1; } }

  // ---- 描画 ----
  // ① バス停名: 4文字幅の枠に固定、長い名はCSSアニメで横スクロール(往復)
  let curTargetName=null;
  function setTargetName(name){
    name=name||'';
    if(name===curTargetName) return;   // 同名は継続(再スタートしない)
    curTargetName=name;
    const box=$('targetName'), t=$('tnText');
    t.classList.remove('scroll'); t.textContent=name;   // リセット
    const over = t.scrollWidth - box.clientWidth;        // 同期測定(rAF不要)
    if(over>2){
      const dur=Math.max(3, over/28);
      t.style.setProperty('--shift', (-over)+'px');
      t.style.setProperty('--dur', dur+'s');
      void t.offsetWidth;                                // reflowでアニメ再適用
      t.classList.add('scroll');
    } else {
      t.style.removeProperty('--shift'); t.style.removeProperty('--dur');
    }
  }
  // 「この次 →」行: 1行固定・長い時は自動縮小
  function setNextPrev(text){
    const el=$('nextPrev'); el.textContent=text||''; el.style.fontSize='26px';
    if(text){ const w=el.clientWidth; if(w>0 && el.scrollWidth>w){ el.style.fontSize=Math.max(13, Math.floor(26*w/el.scrollWidth))+'px'; } }
  }
  function resetMonUI(){
    clearStateClasses();
    $('stateTag').className='state-tag'; $('stateTag').textContent='運行前';
    $('diff').className='diff appr'; $('diff').textContent='--:--';
    $('caption').textContent='GPS開始 または デモで確認';
    $('nextPrev').textContent=''; $('targetDist').textContent='';
    terminalAnnounced=false; lastEarlyAnnounce=0; curTargetName=null;
    if(stops[0]){ setTargetName(stops[0].name); $('targetEta').textContent=hhmm(stops[0]); }
    updateRail();
  }
  // 遅れの程度で色分け: 5分以上=黄, 10分以上=橙 (remainingSecは負=遅れ)
  function lateClass(rem){ const m=-rem/60; if(m>=10) return 'o'; if(m>=5) return 'y'; return null; }

  function render(st){
    clearStateClasses();
    const tag=$('stateTag'), diff=$('diff');
    tag.className='state-tag'; diff.className='diff';
    $('targetDist').textContent = (st.d!=null && isFinite(st.d)) ? `現在地から 約 ${Math.round(st.d)} m` : '';   // ② 距離
    const nxt = st.state!=='finished' ? stops[targetIndex+1] : null;
    setNextPrev(st.state==='finished' ? '' : (nxt ? `次々は ${nxt.name}（定刻 ${hhmm(nxt)}）` : '次々は 終点'));

    if(st.state==='terminal'){   // ⑦ 終点到着(早発判定しない)
      document.body.classList.add('state-ok');
      tag.classList.add('ok'); tag.textContent='🏁 終点に到着';
      diff.classList.add('ok'); diff.textContent='🏁';
      $('caption').textContent='終点に到着しました。お疲れさまでした';
      setTargetName(st.stop.name); $('targetEta').textContent=hhmm(st.stop); $('nextPrev').textContent='';
      if(!terminalAnnounced){ speak('終点に到着しました。お疲れさまでした'); terminalAnnounced=true; stopGps(); }   // 終点でGPS停止
      updateRail(); return;
    }
    if(st.state==='finished'){
      tag.classList.add('appr'); tag.textContent='運行終了(全停通過)'; diff.classList.add('appr'); diff.textContent='--:--';
      $('caption').textContent='お疲れさまでした'; setTargetName('—'); $('targetEta').textContent='--:--'; $('nextPrev').textContent=''; $('targetDist').textContent='';
      updateRail(); return;
    }
    setTargetName(st.stop.name);
    $('targetEta').textContent=hhmm(st.stop);

    if(st.state==='early'){
      document.body.classList.add('state-early');
      tag.classList.add('early'); tag.textContent='🚨 早発注意';
      diff.classList.add('early'); diff.textContent=fmtSec(st.remainingSec);
      $('caption').textContent='';   // 冗長なメッセージは非表示(タグと大きな残り秒で十分)
      { const t=Date.now(); if(t-lastEarlyAnnounce>7000){ speak('早発です'); lastEarlyAnnounce=t; } }   // ⑧ 音声
    } else if(st.state==='ok'){
      const lc=lateClass(st.remainingSec);
      if(lc==='o'){ document.body.classList.add('state-late-o'); tag.classList.add('late-o'); diff.classList.add('late-o'); tag.textContent='⚠ 大幅遅れ'; }
      else if(lc==='y'){ document.body.classList.add('state-late-y'); tag.classList.add('late-y'); diff.classList.add('late-y'); tag.textContent='遅れ'; }
      else { document.body.classList.add('state-ok'); tag.classList.add('ok'); diff.classList.add('ok'); tag.textContent='✅ 正常運行'; }
      diff.textContent='+'+fmtSec(st.remainingSec);
      $('caption').textContent = st.remainingSec<-3 ? `定刻より ${fmtSec(st.remainingSec)} 遅れ` : '定刻到達';
    } else if(st.state==='waiting'){   // ⑤ 始発地は早発警告しない
      tag.classList.add('appr'); tag.textContent='🚏 始発 待機';
      diff.classList.add('appr'); diff.textContent=fmtSec(st.remainingSec);
      $('caption').textContent=`定刻(${hhmm(st.stop)})まで待機`;
    } else { // approaching
      if(st.remainingSec<0){
        const lc=lateClass(st.remainingSec);
        if(lc==='o'){ document.body.classList.add('state-late-o'); diff.classList.add('late-o'); }
        else if(lc==='y'){ document.body.classList.add('state-late-y'); diff.classList.add('late-y'); }
        else diff.classList.add('appr');
        tag.textContent='走行中(遅れ)';
        diff.textContent='−'+fmtSec(st.remainingSec);
        $('caption').textContent=`定刻を ${fmtSec(st.remainingSec)} 超過(遅れは問題なし)`;
      } else {
        tag.classList.add('appr'); tag.textContent='走行中'; diff.classList.add('appr');
        diff.textContent=fmtSec(st.remainingSec);
        $('caption').textContent=`次まで(到着後に早発判定) 定刻 ${hhmm(st.stop)}`;
      }
    }
    updateRail();
  }
  function buildRail(){ const rail=$('rail'); rail.innerHTML=''; stops.forEach((s,i)=>{ const d=document.createElement('div'); d.className='rdot'; d.dataset.i=i; rail.appendChild(d); }); }
  function updateRail(){
    document.querySelectorAll('.rdot').forEach(d=>{ const i=+d.dataset.i; d.classList.toggle('passed', i<targetIndex); d.classList.toggle('cur', i===targetIndex); });
    const cur=stops[targetIndex];
    $('railTxt').textContent = targetIndex<stops.length ? `${targetIndex+1} / ${stops.length}　次: ${cur?cur.name:''}` : `${stops.length} / ${stops.length} 完了`;
  }

  function update(lat,lng,now){ render(evaluate(lat,lng,now)); }

  // ---- GPS ----
  function startGps(){
    if(!navigator.geolocation){ $('gpsNote').textContent='GPS非対応端末'; return; }
    $('gpsNote').textContent='GPS取得中…';
    watchId=navigator.geolocation.watchPosition(
      p=>{ lastLat=p.coords.latitude; lastLng=p.coords.longitude; $('gpsNote').textContent=`精度±${Math.round(p.coords.accuracy)}m`; update(lastLat,lastLng,new Date()); },
      e=>{ $('gpsNote').textContent='位置情報エラー: '+e.message; },
      { enableHighAccuracy:true, maximumAge:1000, timeout:15000 });
    $('startBtn').textContent='停止';
  }
  function stopGps(){ if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; } $('startBtn').textContent='開始'; }
  $('startBtn').addEventListener('click', ()=>{
    primeAudio();
    if(mode==='gps'){
      if(watchId===null){ speak('ドラサポを開始します。ぜんしゅうちゅうで、ご安全に！'); startGps(); }   // ⑤ 開始アナウンス
      else stopGps();
    } else { runDemo(); }
  });

  // ---- 手動で対象バス停を前/次へ(⑥) ----
  function refreshAfterNav(){
    if(mode==='demo') return runDemo();
    if(lastLat!=null) return update(lastLat,lastLng,new Date());
    const s=stops[targetIndex]; if(s){ setTargetName(s.name); $('targetEta').textContent=hhmm(s); }
    const nxt=stops[targetIndex+1]; setNextPrev(nxt?`次々は ${nxt.name}（定刻 ${hhmm(nxt)}）`:'次々は 終点');
    updateRail();
  }
  $('prevBtn').addEventListener('click', ()=>{ if(targetIndex>0){ targetIndex--; lastAtStopIndex=-1; terminalAnnounced=false; refreshAfterNav(); } });
  $('nextBtn').addEventListener('click', ()=>{ if(targetIndex<stops.length-1){ targetIndex++; lastAtStopIndex=-1; terminalAnnounced=false; refreshAfterNav(); } });

  // ---- デモ(GPSなしで早発/正常を確認) ----
  $('modeBtn').addEventListener('click', ()=>{
    primeAudio();
    mode = mode==='gps' ? 'demo' : 'gps';
    $('modeBtn').textContent = mode==='demo' ? '実GPS' : 'デモ';
    $('simRow').style.display = mode==='demo' ? 'flex' : 'none';
    if(mode==='demo'){ stopGps(); $('startBtn').textContent='デモ反映'; runDemo(); }
    else { $('startBtn').textContent='開始'; }
  });
  $('simStop').addEventListener('input', ()=>{ targetIndex=+$('simStop').value; lastAtStopIndex=-1; runDemo(); });
  $('simOff').addEventListener('click', ()=>{
    // 早発 → 正常 → 5.5分遅れ(黄) → 11分遅れ(橙) → 早発…
    simOffset = simOffset===-30 ? 15 : (simOffset===15 ? 330 : (simOffset===330 ? 660 : -30));
    $('simOff').textContent = simOffset<0 ? `早発${simOffset}s`
      : (simOffset>=600 ? '遅れ+11分(橙)' : (simOffset>=300 ? '遅れ+5.5分(黄)' : `遅れ+${simOffset}s`));
    runDemo();
  });
  function runDemo(){
    if(!stops.length) return;
    const stop=stops[targetIndex]; if(!stop) return;
    // 対象停に居ることにし、現在時刻=定刻+オフセット と仮定
    const fakeNow=new Date(schedDate(stop).getTime() + simOffset*1000);
    lastAtStopIndex=targetIndex; lastLat=stop.lat; lastLng=stop.lng; // 半径内扱い
    render(evaluate(stop.lat, stop.lng, fakeNow));
  }

  // ---- 音声ON/OFF(⑦)・声色(⑥) ----
  function updateAudioBtn(){ $('audioBtn').textContent = audioOn ? '🔊音ON' : '🔇音OFF'; }
  function updateVoiceBtn(){ $('voiceBtn').textContent = voiceGender==='male' ? '男声' : '女声'; }
  $('audioBtn').addEventListener('click', ()=>{
    audioOn=!audioOn; lsSet('mon_audio', audioOn?'on':'off'); updateAudioBtn();
    if(audioOn){ primeAudio(); speak('音声オン'); } else { try{ window.speechSynthesis.cancel(); }catch(e){} }
  });
  $('voiceBtn').addEventListener('click', ()=>{
    voiceGender = voiceGender==='male' ? 'female':'male'; lsSet('mon_voice', voiceGender); updateVoiceBtn();
    primeAudio(); speak('この声で案内します');
  });
  updateAudioBtn(); updateVoiceBtn();

  // ---- 判定半径プルダウン(5m刻み・既定20m・localStorage保存) ----
  (function initRadius(){
    const r=$('radius');
    for(let m=5;m<=60;m+=5){ const o=document.createElement('option'); o.value=m; o.textContent=m+' m'; if(m===STOP_RADIUS_M) o.selected=true; r.appendChild(o); }
    r.addEventListener('change', ()=>{
      STOP_RADIUS_M=parseInt(r.value,10); lsSet('mon_radius',String(STOP_RADIUS_M));
      if(mode==='demo') runDemo();
    });
  })();

  // ---- ⑨ オープニング: オリジナルの勇壮なファンファーレを鳴らし、その長さだけ表示 ----
  function playOpeningFanfare(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return 2700;
      const ctx=new AC(); let played=false;
      const schedule=()=>{
        if(played) return; played=true;
        const master=ctx.createGain(); master.gain.value=0.32; master.connect(ctx.destination);
        const note=(f,s,d,v)=>{
          const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain();
          o.type='sawtooth'; o2.type='square'; o.frequency.value=f; o2.frequency.value=f; o2.detune.value=7;
          g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(v,s+0.03);
          g.gain.exponentialRampToValueAtTime(0.0001,s+d);
          o.connect(g); o2.connect(g); g.connect(master);
          o.start(s); o2.start(s); o.stop(s+d+0.05); o2.stop(s+d+0.05);
        };
        const C5=523.25,G4=392,E5=659.25,G5=784,C6=1046.5;
        let t=ctx.currentTime+0.06;
        note(C5,t,0.16,0.45); t+=0.17;
        note(G4,t,0.12,0.40); t+=0.14;
        note(C5,t,0.12,0.45); t+=0.16;
        note(E5,t,0.20,0.50); t+=0.22;
        note(G5,t,0.50,0.55); t+=0.55;
        note(C5,t,1.1,0.30); note(E5,t,1.1,0.32); note(G5,t,1.1,0.36); note(C6,t,1.1,0.30);
      };
      if(ctx.state==='suspended'){
        ctx.resume().then(schedule).catch(()=>{});
        const once=()=>{ ctx.resume().then(schedule).catch(()=>{}); };   // iOS: 初回タップで再生
        window.addEventListener('pointerdown',once,{once:true});
        window.addEventListener('touchend',once,{once:true});
      } else schedule();
      return 2700;  // 音源の長さ(ms)=表示時間
    }catch(e){ return 2600; }
  }
  (function opening(){
    const ms = playOpeningFanfare() || 2600;
    setTimeout(()=>{ const s=$('splash'); if(s){ s.classList.add('hide'); setTimeout(()=>{ if(s.parentNode) s.remove(); }, 600); } }, ms);
  })();

  // ---- Service Worker ----
  if('serviceWorker' in navigator && location.protocol==='https:'){
    window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
</script>
