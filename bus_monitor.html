<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>しまバスドラサポ</title>
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="./manifest_monitor.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ドラサポ">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --bg:#14171c; --panel:#1c2029; --panel-2:#232833; --line:#2e3440;
    --ink:#eef0f4; --ink-dim:#8a91a3; --ink-faint:#565d6d;
    --ok:#35d68a; --early:#ef4444; --neutral:#4da3ff; --late-y:#f0b93d; --late-o:#ff8c3a;
    --mono:'DejaVu Sans Mono','Courier New',ui-monospace,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); overscroll-behavior-y:none; touch-action:manipulation;}
  button, select, .rdot, .controls{ touch-action:manipulation; }   /* ダブルタップ拡大を無効化 */
  /* 自然フロー+ページスクロール。下部の副操作は画面外にはみ出してよい */
  body{min-height:100dvh; transition:background .3s ease;
       padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}
  body.state-early{ animation:flashRed .9s infinite; }
  @keyframes flashRed{ 0%,100%{background:#3a0d0d;} 50%{background:#8f1d1d;} }
  body.state-ok{ background:#0d2b1e; }
  body.state-late-y{ background:#2e2606; }
  body.state-late-o{ background:#331a06; }

  /* オープニング(タップでアニメ+音を同時再生) */
  #splash{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 38%, #143a72, #0a1020 72%); overflow:hidden; }
  #splash.hide{ opacity:0; visibility:hidden; transition:opacity .5s ease, visibility .5s; }
  #splash.play::before{ content:""; position:absolute; top:-60%; left:-30%; width:60%; height:220%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); transform:rotate(18deg);
    animation:sweep 1.4s ease-in-out .3s; }
  @keyframes sweep{ 0%{ left:-40%; } 100%{ left:120%; } }
  .splash-inner{ text-align:center; }
  .splash-logo{ font-size:76px; opacity:0; }
  .splash-title{ font-size:46px; font-weight:900; letter-spacing:.1em; margin-top:4px;
    background:linear-gradient(90deg,#fff,#8fd0ff,#fff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:#fff; opacity:0; }
  .splash-sub{ font-size:14px; color:#9fb6d8; margin-top:10px; letter-spacing:.14em; opacity:0; }
  .splash-hint{ margin-top:28px; font-size:15px; color:#cfe0f5; letter-spacing:.06em; animation:hintPulse 1.2s ease-in-out infinite; }
  .splash-copy{ position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 22px); text-align:center; font-size:11px; color:#7f97b8; letter-spacing:.03em; }
  #splash.play .splash-logo{ animation:logoIn 1s cubic-bezier(.2,1.4,.35,1) both; }
  #splash.play .splash-title{ animation:titleIn .8s .35s both; }
  #splash.play .splash-sub{ animation:titleIn .8s .6s both; }
  #splash.play .splash-hint{ display:none; }
  @keyframes hintPulse{ 0%,100%{ opacity:.4; } 50%{ opacity:1; } }
  @keyframes logoIn{ 0%{ transform:scale(.2) rotate(-25deg); opacity:0; } 100%{ transform:scale(1) rotate(0); opacity:1; } }
  @keyframes titleIn{ 0%{ transform:translateY(14px); opacity:0; } 100%{ transform:translateY(0); opacity:1; } }

  .screen{ display:none; }
  .screen.active{ display:block; }

  .topbar{ padding:12px 16px 10px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; }
  .title{ font-size:15px; font-weight:700; }
  .clock{ font-family:var(--mono); font-size:13px; color:var(--ink-dim); font-variant-numeric:tabular-nums; }

  /* setup */
  .form{ padding:18px 18px; display:flex; flex-direction:column; gap:16px; }
  .field label{ font-size:12px; color:var(--ink-dim); display:block; margin-bottom:6px; }
  .field input[type=date], .field input[type=number]{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    border-radius:9px; padding:12px; font-size:17px; font-family:var(--sans);
  }
  #dateInput{ font-size:34px; padding:14px 12px; text-align:center; font-family:var(--mono); font-weight:700; }
  .dia-row{ display:flex; gap:8px; align-items:stretch; }
  .dia-row input{ flex:2; min-width:0; }
  .dia-row .big-btn{ flex:3; white-space:nowrap; padding:12px 10px; font-size:15px; }
  .seg{ display:flex; gap:8px; }
  .seg button{ flex:1; padding:12px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink-dim); font-size:14px; font-weight:600; }
  .seg button.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .big-btn{ padding:15px; border-radius:11px; border:none; background:var(--ink); color:var(--bg); font-size:16px; font-weight:700; }
  /* デモ操作バー */
  .demo-clock{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:30px; font-weight:800; letter-spacing:1px; }
  .demo-diff{ margin-left:auto; font-size:15px; font-weight:700; color:var(--ink-dim); }
  .demo-diff.early{ color:var(--early); } .demo-diff.late{ color:var(--late-y); }
  .spd{ min-width:46px; padding:9px 0; border-radius:9px; border:1px solid var(--line);
        background:var(--panel-2); color:var(--ink); font-size:15px; font-weight:800; }
  .spd.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .dia-list-btn{ width:100%; padding:13px; border-radius:11px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); font-size:15px; font-weight:700; }
  .dia-list-panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; width:100%; max-width:460px; max-height:82vh; display:flex; flex-direction:column; overflow:hidden; }
  .dl-head{ display:flex; justify-content:space-between; align-items:center; padding:13px 16px; border-bottom:1px solid var(--line); font-size:16px; font-weight:800; }
  .dl-head button{ background:none; border:none; color:var(--ink-dim); font-size:22px; padding:0 4px; }
  .dl-body{ overflow-y:auto; padding:10px 12px; }
  .dl-loading{ text-align:center; color:var(--ink-dim); padding:26px; }
  .dl-row{ width:100%; text-align:left; display:flex; align-items:center; gap:12px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; color:var(--ink); }
  .dl-no{ font-family:var(--mono); font-size:24px; font-weight:800; min-width:52px; text-align:center; }
  .dl-route{ flex:1; font-size:14px; line-height:1.55; min-width:0; }
  .dl-line{ display:flex; align-items:baseline; gap:7px; }
  .dl-lb{ font-size:11px; color:var(--ink-faint); min-width:32px; }
  .dl-pl{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dl-t{ font-family:var(--mono); font-size:18px; font-weight:800; color:var(--ink); margin-left:auto; letter-spacing:.5px; }
  .msg{ font-size:12.5px; color:var(--ink-faint); text-align:center; min-height:16px; padding:0 16px; }
  .msg.err{ color:var(--early); }

  /* course list */
  .list-head{ padding:10px 16px; font-size:12px; color:var(--ink-dim); border-bottom:1px solid var(--line); }
  .list{ flex:1; overflow-y:auto; padding:10px 14px 16px; }
  .course{ width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:9px; display:flex; align-items:center; gap:12px; color:var(--ink); }
  .course:disabled{ opacity:.5; }
  .course .seqn{ width:30px; height:30px; border-radius:50%; background:var(--panel-2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink-dim); flex-shrink:0; }
  .course .body{ flex:1; min-width:0; }
  .course .route{ font-size:18px; font-weight:700; }
  .course .sub{ font-size:11px; color:var(--ink-dim); margin-top:3px; }
  .course .time{ font-family:var(--mono); font-size:26px; font-weight:800; }   /* ④ 発時刻を見やすく強調 */
  .rest-row{ text-align:center; font-size:18px; font-weight:800; color:#ffffff; margin:-4px 0 9px; letter-spacing:.06em; }   /* ③ 休憩(始発→到着と同サイズ・太字・白) */
  .badge{ font-size:14px; font-weight:700; padding:2px 9px; border-radius:6px; background:var(--panel-2); color:var(--ink-dim); margin-left:8px; white-space:nowrap; }
  .badge.pay{ background:var(--late-y); color:#241c00; font-weight:800; }   /* 納金は黄で強調 */
  .badge.nodata{ background:var(--late-r); color:#fff; font-weight:800; }   /* 停留所データ未整備 */

  /* monitor */
  .mon{ display:block; }
  .mon-top{ padding:8px 16px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .mon-course{ font-size:18px; font-weight:800; line-height:1.15; }
  .mon-sub{ font-size:15px; font-weight:600; color:var(--ink-dim); margin-top:3px; }
  .mon-zone{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 16px 6px; text-align:center; }
  .state-tag{ font-size:19px; font-weight:800; letter-spacing:.06em; padding:6px 18px; border-radius:20px; margin-bottom:6px; background:var(--panel-2); color:var(--ink-dim); border:1px solid var(--line); }
  .state-tag.early{ background:var(--early); color:#fff; border-color:var(--early); }
  .state-tag.ok{ background:var(--ok); color:#062f1c; border-color:var(--ok); }
  .state-tag.late-y{ background:var(--late-y); color:#241c00; border-color:var(--late-y); }
  .state-tag.late-o{ background:var(--late-o); color:#2a1400; border-color:var(--late-o); }
  .diff-label{ font-size:12px; letter-spacing:.14em; color:var(--ink-dim); text-transform:uppercase; margin-bottom:6px; }
  .diff{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:72px; font-weight:800; line-height:1; }
  body.state-early .diff{ color:#fff; }
  .diff.ok{ color:var(--ok); } .diff.early{ color:#fff; } .diff.appr{ color:var(--ink); }
  .diff.late-y{ color:var(--late-y); } .diff.late-o{ color:var(--late-o); }
  .caption{ margin-top:12px; font-size:16px; color:var(--ink-dim); }
  body.state-early .caption{ color:rgba(255,255,255,.9); }
  .next-prev{ margin-top:10px; font-size:26px; font-weight:700; color:var(--ink); max-width:100%; white-space:nowrap; overflow:hidden; }
  .target-card{ margin-top:12px; width:100%; max-width:460px; background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tc-left{ flex:1; min-width:0; }
  .tc-lbl{ font-size:11px; color:var(--ink-dim); }
  .target-name{ width:100%; font-size:44px; font-weight:800; line-height:1.1; white-space:nowrap; overflow:hidden; }
  .tn-text{ display:inline-block; will-change:transform; }
  .tn-text.scroll{ animation: tnMarquee var(--dur,7s) linear infinite; }   /* ④ 先頭表示→左スクロール→繰り返し */
  @keyframes tnMarquee{ 0%,12%{ transform:translateX(0); } 88%,100%{ transform:translateX(var(--to,0)); } }
  .target-dist{ font-size:20px; font-weight:800; color:var(--ink); margin-top:4px; text-align:left; }   /* ① 距離を強調 */
  .target-eta{ text-align:right; flex-shrink:0; font-family:var(--mono); font-weight:800; line-height:1.02; }  /* ⑪ 時・分を2段 */
  .target-eta .t{ font-size:30px; }

  .rail{ display:flex; gap:3px; padding:6px 16px 2px; flex-wrap:wrap; }
  .rdot{ width:9px; height:9px; border-radius:50%; background:var(--panel-2); border:1px solid var(--ink-faint); }
  .rdot.passed{ background:var(--ink-faint); }
  .rdot.cur{ background:var(--ink); border-color:var(--ink); transform:scale(1.3); }
  .rail-txt{ font-size:13px; color:var(--ink-dim); padding:2px 16px 8px; display:flex; align-items:baseline; gap:8px; }
  .rt-count{ font-family:var(--mono); font-weight:800; font-size:17px; color:var(--ink); letter-spacing:.5px; }
  .rt-sep{ opacity:.45; margin:0 2px; }
  .rt-next{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .live-btn{ flex:1; padding:11px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); font-size:15px; font-weight:700; }
  .live-btn.on{ background:#b91c1c; color:#fff; border-color:#b91c1c; }
  .gps-note{ font-size:11px; color:var(--ink-faint); text-align:center; padding:0 16px 6px; }

  .controls{ display:flex; gap:6px; align-items:stretch; padding:10px 12px; }
  .controls.primary{ border-top:1px solid var(--line); }
  .controls button{ flex:1; padding:14px 6px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); font-size:14px; font-weight:700; white-space:nowrap; }
  .controls .adv{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .controls.secondary button{ font-size:13px; font-weight:600; padding:12px 6px; }
  .controls button.off{ opacity:.45; }
  .radius-sel{ flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:12px 6px; font-size:14px; font-family:var(--sans); text-align:center; }
  .sim{ display:flex; flex-direction:column; gap:8px; width:100%; padding:6px 16px 4px; }
  .sim-line{ display:flex; align-items:center; gap:10px; }
  .sim-line .sl{ font-size:12px; color:var(--ink-dim); white-space:nowrap; }
  .sim-line input[type=range]{ flex:1; min-width:0; accent-color:var(--neutral); height:30px; }
  .sim-off-btn{ width:100%; padding:11px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); font-size:13px; font-weight:600; }

  /* ⑥ 方向幕確認ポップアップ */
  .overlay{ position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.62); display:none; align-items:center; justify-content:center; padding:24px; }
  .overlay.show{ display:flex; }
  /* ① 発車カウントダウン(残り10秒〜) */
  #depCount{ position:fixed; inset:0; z-index:86; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(6,10,20,.78); }
  #depCount.show{ display:flex; }
  #depCountNum{ font-family:var(--mono); font-size:46vw; font-weight:900; color:#fff; line-height:.9; text-shadow:0 0 30px rgba(77,163,255,.6); }
  #depCount .dep-lbl{ font-size:22px; color:#cfe0f5; margin-top:12px; letter-spacing:.25em; }
  .dialog{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px 20px; max-width:430px; width:100%; text-align:center; }
  .dialog .d-head{ font-size:13px; color:var(--ink-dim); }
  .dialog .d-dest{ font-size:26px; font-weight:800; margin:8px 0 4px; }
  .dialog .d-note{ font-size:23px; font-weight:900; color:#241c00; background:var(--late-y); border-radius:10px; padding:10px 8px; margin-bottom:16px; letter-spacing:.05em; }
  .dialog .d-rows{ text-align:left; background:var(--panel-2); border-radius:10px; padding:12px 16px; margin-bottom:18px; }
  .dialog .d-row{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:4px 0; }
  .dialog .d-k{ font-size:14px; color:var(--ink-dim); white-space:nowrap; }
  .dialog .d-v{ font-size:30px; font-weight:800; font-family:var(--mono); letter-spacing:.02em; }
  .dialog .d-check{ display:flex; align-items:center; justify-content:center; gap:10px; font-size:20px; font-weight:900; color:#241c00; background:var(--late-y); border-radius:10px; padding:14px 10px; margin-bottom:16px; letter-spacing:.03em; cursor:pointer; }
  .dialog .d-check input{ width:26px; height:26px; accent-color:#241c00; flex-shrink:0; }
  .dialog .d-ok{ width:100%; padding:15px; border:none; border-radius:11px; background:var(--ink); color:var(--bg); font-size:17px; font-weight:800; }
  .dialog .d-ok:disabled{ opacity:.4; }
  .dialog .d-cancel{ width:100%; padding:11px; border:none; border-radius:10px; background:transparent; color:var(--ink-dim); font-size:13px; margin-top:8px; }
  /* トースト・補正表示 */
  .toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 100px); transform:translateX(-50%); background:rgba(0,0,0,.85); color:#fff; padding:11px 20px; border-radius:20px; font-size:14px; z-index:80; opacity:0; transition:opacity .3s; pointer-events:none; max-width:90%; text-align:center; }
  .toast.show{ opacity:1; }
  .rdot.fixed{ background:var(--early); border-color:var(--early); }
  #correctBtn{ background:#3a1414; border-color:#7a2b2b; color:#ffb4b4; }
  /* ① 座標修正メッセージ */
  .fix-msg{ display:none; margin-top:10px; width:100%; max-width:460px; background:var(--early); color:#fff; font-size:17px; font-weight:800; border-radius:10px; padding:10px 12px; text-align:center; }
  .fix-msg.show{ display:block; }
  /* ⑪ 大幅遅延=赤 */
  body.state-late-r{ background:#3a1010; }
  .state-tag.late-r{ background:var(--early); color:#fff; border-color:var(--early); }
  .diff.late-r{ color:var(--early); }
  /* ⑤ アプリを閉じる */
  .close-btn{ width:100%; margin-top:26px; padding:13px; border-radius:11px; border:1px solid var(--line); background:transparent; color:var(--ink-dim); font-size:14px; font-weight:700; }
  .manual-link{ display:block; width:100%; margin-top:10px; padding:13px; border-radius:11px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); font-size:15px; font-weight:700; text-align:center; text-decoration:none; }
  #byeOverlay{ position:fixed; inset:0; z-index:120; display:none; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%,#143a72,#0a1020 72%); }
  #byeOverlay.show{ display:flex; }
  #byeOverlay .bye{ font-size:40px; font-weight:900; color:#fff; letter-spacing:.06em; text-align:center; }
  /* ⑥ 画面フラッシュ(1回) */
  #flash{ position:fixed; inset:0; z-index:110; background:#fff; opacity:0; pointer-events:none; }
  #flash.on{ animation:flashOnce .5s ease 3; }   /* ② 3回連続 */
  @keyframes flashOnce{ 0%{opacity:0;} 18%{opacity:.9;} 100%{opacity:0;} }
  /* ① 座標修正が必要な時は補正ボタンを点滅(地味に通知) */
  #correctBtn.blink{ animation:corrBlink 1s ease-in-out infinite; }
  @keyframes corrBlink{ 0%,100%{ background:#3a1414; border-color:#7a2b2b; } 50%{ background:var(--early); border-color:var(--early); color:#fff; } }
  /* 終点到着: チェッカーフラッグを振る全画面演出 */
  #finishFx{ position:fixed; inset:0; z-index:115; display:none; align-items:center; justify-content:center; flex-direction:column;
    background:radial-gradient(circle at 50% 42%, #0f2f22, #06110d 75%); overflow:hidden; }
  #finishFx.show{ display:flex; animation:fxIn .35s ease both; }
  #finishFx.out{ animation:fxOut .6s ease both; }
  @keyframes fxIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes fxOut{ from{opacity:1;} to{opacity:0; visibility:hidden;} }
  /* 画面いっぱいの市松模様が布のように波打つ(canvasで描画) */
  #fxCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .fx-text{ position:relative; z-index:2; text-align:center; padding:0 18px; }
  .fx-title{ font-size:38px; font-weight:900; color:#fff; letter-spacing:.08em;
    text-shadow:0 3px 18px rgba(0,0,0,.95), 0 0 8px rgba(0,0,0,.9); }
  .fx-sub{ margin-top:10px; font-size:18px; font-weight:700; color:#fff; letter-spacing:.05em;
    text-shadow:0 2px 14px rgba(0,0,0,.95), 0 0 8px rgba(0,0,0,.9); }
  .fx-tap{ position:absolute; z-index:2; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 26px); text-align:center;
    font-size:13px; color:#fff; opacity:.85; text-shadow:0 2px 10px rgba(0,0,0,.9); }
  /* 終点後の案内(次コース / 本日終了) */
  #nextCourseMsg{ display:none; margin-top:14px; width:100%; max-width:460px; border-radius:12px; padding:14px 16px; text-align:center;
    background:var(--panel-2); border:1px solid var(--line); }
  #nextCourseMsg.show{ display:block; }
  #nextCourseMsg .nc-lbl{ font-size:12px; color:var(--ink-dim); letter-spacing:.1em; }
  #nextCourseMsg .nc-main{ font-size:20px; font-weight:800; line-height:1.45; margin-top:6px; }

<script>
(function(){
  // tokyoknock.com 配下なら相対(同一オリジン=CORS不要)、それ以外(GitHub Pages等)は絶対URL
  const REST_MIN = 20;   // 次のコースまでこの分数以上あけば「休憩」と表示する
  const API_BASE = (location.origin === 'https://tokyoknock.com') ? 'api/' : 'https://tokyoknock.com/bus/api/';
  const CORRECT_SECRET = 'shimabus-fix-2026';   // ⑫ 補正APIの合言葉(update_busstops.php と一致させる)
  const CORRECT_MAX_ACC = 10;   // 補正はGPS精度±この値(m)以内のときのみ許可
  const EARLY_GRACE = 15;                        // ① 定刻の15秒前以内は早発としない(許容)
  let STOP_RADIUS_M = parseInt(lsGet('mon_radius') || '20', 10);   // 既定20m・画面で変更可

  function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
  function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }

  let dayType = 1;
  let courses = [];
  let course = null;      // 選択中コース {dia_course_id, ...}
  let stops = [];         // course_stops [{seq,name,lat,lng,scheduled_time,...}]
  let targetIndex = 0;
  let lastAtStopIndex = -1;
  let fareData=null;                      // コース選択時に先読みする三角表 {stops,matrix}
  let stillPos=null, stillSince=0;        // ① 停車検知
  let preEarlyWarnedIdx=-1;               // ⑥ 200m手前 早発注意(停ごと1回)
  let runStartAt=0;                       // ④ 開始直後は座標修正の通知を出さない
  const FIX_QUIET_MS=60000;               //    開始から60秒は抑止
  let watchId = null;
  let mode = 'gps';       // 'gps' | 'demo'
  let lastLat=null, lastLng=null;
  let audioPrimed=false, lastEarlyAnnounce=0, terminalAnnounced=false;
  let earlyIdx=-1, earlyN=0, okAnnouncedIdx=-1, preOkIdx=-1;          // 早発回数・定刻案内
  let corrections={};                                                // ⑫ 補正 {busstop_id:{lat,lng}}
  let currentDiaNo=null;
  let jaVoices=[];
  // ③ 音量: 0=大,1=中,2=小,3=消
  const VOL=[1.0,0.55,0.28,0], VOL_LABEL=['🔊大','🔉中','🔈小','🔇消'];
  let volLevel = Math.min(3, Math.max(0, parseInt(lsGet('mon_vol')||'0',10)));
  let nameSpeech = lsGet('mon_name_speech')!=='0';   // バス停名の読み上げ(既定ON)

  // ---- 音声(iOS Safari: ユーザー操作でunlock) ----
  let enVoices=[];
  function loadVoices(){ try{
    const v=window.speechSynthesis.getVoices();
    jaVoices = v.filter(x=>/ja|JP/i.test(x.lang));
    enVoices = v.filter(x=>/^en[-_]?/i.test(x.lang));
    enVoicePicked = null;
  }catch(e){} }
  function hasEnVoice(){ if(!enVoices.length) loadVoices(); return enVoices.length>0; }
  // 端末に入っている英語音声の中から、いちばん自然に聞こえるものを選ぶ。
  // 端末ごとに入っている声が違うため、名前と言語で優先順位を付ける。
  const EN_GOOD=[/\bAva\b/i,/\bSamantha\b/i,/\bAllison\b/i,/\bSiri\b/i,/Google US English/i,
                 /Microsoft (Aria|Jenny|Guy|Michelle|Ana)/i,/Natural/i,/Enhanced/i,/Premium/i,/Neural/i];
  const EN_BAD =[/compact/i,/eloquence/i,/espeak/i,/novelty/i,/Fred/i,/Albert/i,/Zarvox/i,/Trinoids/i];
  let enVoicePicked=null;
  function pickEnVoice(){
    if(enVoicePicked) return enVoicePicked;
    if(!enVoices.length) loadVoices();
    if(!enVoices.length) return null;
    const score=v=>{
      let p = /^en[-_]US/i.test(v.lang) ? 40 : (/^en[-_]GB/i.test(v.lang) ? 28 : 12);
      EN_GOOD.forEach((re,i)=>{ if(re.test(v.name||'')) p += 30 - i; });
      EN_BAD.forEach(re=>{ if(re.test(v.name||'')) p -= 40; });
      if(v.localService===false) p += 4;        // 読み上げの質が高いことが多い
      return p;
    };
    enVoicePicked = enVoices.slice().sort((a,b)=>score(b)-score(a))[0];
    return enVoicePicked;
  }
  function primeAudio(){ if(audioPrimed) return; try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; window.speechSynthesis.speak(u); audioPrimed=true; }catch(e){} }
  // 文を言語ごとに分けて続けて読む。停留所名は日本語の声のままにするため
  function speakParts(parts){
    const vol=VOL[volLevel]; if(vol<=0) return;
    try{
      window.speechSynthesis.cancel();
      if(!jaVoices.length || !enVoices.length) loadVoices();
      parts.filter(p=>p && p.t && String(p.t).trim()).forEach(p=>{
        const u=new SpeechSynthesisUtterance(String(p.t));
        if(p.l==='en' && enVoices.length){ const ev=pickEnVoice(); u.lang=(ev&&ev.lang)||'en-US'; if(ev) u.voice=ev; }
        else { u.lang='ja-JP'; if(jaVoices[0]) u.voice=jaVoices[0]; }
        u.rate = (p.l==='en') ? 0.95 : 1.0;   // 英語は少しゆっくりの方が聞き取りやすい
        u.volume=vol; window.speechSynthesis.speak(u);
      });
    }catch(e){}
  }
  // 英語表示でも、端末に英語の声が無ければ日本語の声で読む
  function speak(text){ speakParts([{t:text, l:(lang==='en' && hasEnVoice()) ? 'en' : 'ja'}]); }
  // 「Next stop is 〇〇.」… 停留所名だけ日本語の声。名前のあとに短い間を置く
  function speakNext(prefix, name){
    if(lang==='en' && hasEnVoice()) speakParts([{t:prefix,l:'en'},{t:name+'。',l:'ja'}]);
    else speakParts([{t:prefix+(lang==='en'?' ':'')+name+T('です'), l:'ja'}]);
  }
  // 文を言語ごとの断片に分ける。jaKeys に挙げた差し込み(地名など)は日本語の声で読む
  function partsOf(key, vars, jaKeys){
    if(!(lang==='en' && hasEnVoice())) return [{t:T(key,vars), l:'ja'}];
    const SEP='\u0001', tmp={};
    for(const k in vars) tmp[k] = (jaKeys||[]).includes(k) ? SEP+vars[k]+SEP : vars[k];
    return T(key,tmp).split(SEP)
      .map((seg,i)=>({t:seg, l:(i%2) ? 'ja' : 'en'}))
      .filter(p=>String(p.t).trim());
  }
  // 開始の挨拶。英語でも「キバリンショロー」は島口のまま日本語の声で読む
  function speakOpening(){
    if(lang==='en' && hasEnVoice())
      speakParts([{t:T('ドラサポを開始します。キバリンショロー、ご安全に！'),l:'en'},{t:'キバリンショロー',l:'ja'}]);
    else speakParts([{t:'ドラサポを開始します。キバリンショロー、ご安全に！',l:'ja'}]);
  }
  function speakStop(text){ if(nameSpeech) speak(text); }   // バス停名読み上げ(ON時のみ)
  const yomi = s => (s && (s.kana || s.name)) || '';   // ⑦ 発音はkana優先
  try{ window.speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); }catch(e){}

  const $ = id => document.getElementById(id);
  let toastT=null;
  function toast(msg){ const el=$('toast'); if(!el) return; el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'), 2400); }

  /* ===== 日本語 / English の切り替え ==============================
     ・辞書のキーは日本語の原文そのもの。英訳が無ければ日本語のまま出す
     ・{xx} は差し込み。T('残り {n} 分', {n:3}) のように使う
     ・画面に最初から書いてある文字は、起動時に文字を覚えておき、
       切替時にまとめて差し替える(HTML側に印を付けなくて済む)
     ・停留所名は日本語のまま。読み上げも日本語の声で読む
     ================================================================ */
  let lang = (lsGet('mon_lang')==='en') ? 'en' : 'ja';
  const L = {

  function T(ja, vars){
    let s = (lang==='en' && L[ja]!=null) ? L[ja] : ja;
    if(vars) for(const k in vars) s = s.split('{'+k+'}').join(vars[k]);
    return s;
  }
  // 画面に最初から書いてある文字を覚えておき、切替でまとめて差し替える
  const staticTexts=[];
  function scanStaticTexts(){
    const w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    let n; while((n=w.nextNode())){
      const t=n.nodeValue.trim();
      if(t && L[t]!=null) staticTexts.push({node:n, ja:n.nodeValue});
    }
    document.querySelectorAll('[placeholder]').forEach(el=>{
      if(L[el.placeholder]!=null) staticTexts.push({el, attr:'placeholder', ja:el.placeholder});
    });
  }
  function applyLang(){
    staticTexts.forEach(x=>{
      const v = (lang==='en' && L[x.ja.trim()]!=null)
        ? x.ja.replace(x.ja.trim(), L[x.ja.trim()]) : x.ja;
      if(x.node) x.node.nodeValue=v; else x.el.setAttribute(x.attr, v);
    });
    document.documentElement.lang = (lang==='en') ? 'en' : 'ja';
    const b=$('langBtn'); if(b) b.textContent = (lang==='en') ? '日本語' : 'EN';
    const ml=$('manualLink'); if(ml) ml.href = './manual.html' + (lang==='en' ? '?lang=en' : '');   // ガイドも同じ言語で開く
    updateVolBtn(); updateNameBtn();
    // textContent で書き換えた要素は起動時に覚えたノードが外れているため、ここで付け直す
    const sb=$('startBtn');
    if(sb) sb.textContent = T((typeof isRunning==='function' && isRunning()) ? '停止' : '開始');
    if(typeof updateHoldBtn==='function') updateHoldBtn();
    // いま出ている画面を描き直す(走行中でなければ待機表示も作り直す)
    if(courses.length && $('scList').classList.contains('active'))
      renderCourses({dia_no:currentDiaNo, count:courses.length});
    if(stops.length){
      if(typeof isRunning==='function' && isRunning()) refreshDisp(stops[targetIndex]);
      else resetMonUI();
    }
  }
  function toggleLang(){
    // いつでも切り替えられる。読み上げ中の文だけ止めて、次の案内から新しい言語にする
    try{ window.speechSynthesis.cancel(); }catch(e){}
    lang = (lang==='en') ? 'ja' : 'en';
    lsSet('mon_lang', lang);
    applyLang();
  }


  function setEta(hm){ const p=(hm||'--:--').split(':'); $('targetEtaH').textContent=p[0]||'--'; $('targetEtaM').textContent=p[1]||'--'; }  // ⑪ 時/分2段
  function dispName(s){ return (s && corrections[s.busstop_id]) ? s.name+'🔴' : (s?s.name:''); }  // ⑫ 補正済は🔴

  // ---- 画面遷移 ----
  function clearStateClasses(){ document.body.classList.remove('state-early','state-ok','state-late-y','state-late-o','state-late-r'); }
  function show(id){ ['scSetup','scList','scMon'].forEach(s=> $(s).classList.toggle('active', s===id)); if(id!=='scMon') clearStateClasses(); }

  // ---- 時計 ----
  function tickClock(){ const t=new Date().toLocaleTimeString('ja-JP',{hour12:false}); const c1=$('clock1'),c2=$('clock2'); if(c1)c1.textContent=t; if(c2)c2.textContent=t; }
  setInterval(tickClock,1000); tickClock();

  // ---- 距離(ハーバサイン) ----
  const R=6371000;
  function distM(a,b,c,d){ const r=x=>x*Math.PI/180; const dLat=r(c-a),dLng=r(d-b);
    const s=Math.sin(dLat/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLng/2)**2; return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }

  // ---- 日付→ダイヤ種別 ----
  function autoDayType(dstr){ if(!dstr) return 1; const d=new Date(dstr+'T00:00'); const w=d.getDay(); return (w===0||w===6)?2:1; }
  function setDayType(dt){ dayType=dt; $('dtWeekday').classList.toggle('active',dt===1); $('dtHoliday').classList.toggle('active',dt===2); }
  $('dtWeekday').onclick=()=>setDayType(1);
  $('dtHoliday').onclick=()=>setDayType(2);
  (function initDate(){
    const t=new Date(); const iso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
    $('dateInput').value=iso; setDayType(autoDayType(iso));
    const savedDia=lsGet('mon_dia'); if(savedDia) $('diaInput').value=savedDia;
  })();

  $('loadCoursesBtn').addEventListener('click', async ()=>{

    lsSet('mon_dia', dia);
    setupMsg(T('取得中…'), false);
    try{
      const r=await fetch(`${API_BASE}courses.php?dia_no=${dia}&day_type=${dayType}&_=${Date.now()}`, {cache:'no-store'});
      const j=await r.json();
      if(!r.ok || j.error){ setupMsg(T('取得失敗: ')+(j.error||r.status), true); return; }
      if(!j.courses || !j.courses.length){ setupMsg(T('ダイヤ {no}({type})のコースが見つかりません',{no:j.dia_no,type:T(dayType===1?'平日':'土日祝')}), true); return; }
      courses=j.courses; currentDiaNo=j.dia_no;
      renderCourses(j);
      show('scList');
    }catch(e){ setupMsg(T('通信エラー: ')+e.message, true); }

  function renderCourses(j){
    $('listHead').textContent = T('ダイヤ {no} ・ {type} ・ {n}コース',{no:j.dia_no,type:T(dayType===1?'平日':'土日祝'),n:j.count});
    const wrap=$('courseList'); wrap.innerHTML='';
    const catName={1:T('点検'),2:T('回送'),3:T('実車'),4:'—',5:T('清掃')};
    courses.forEach((c,idx)=>{
      const btn=document.createElement('button'); btn.className='course';
      const noStops = (c.category===3 && !c.arrival_time);   // 着時刻が無い = 停留所データ未整備
      const selectable = c.category===3 && !noStops;
      btn.disabled=!selectable;
      btn.innerHTML =
        `<div class="seqn">${c.seq}</div>`+
        `<div class="body"><div class="route">${c.start_place||'—'} → ${c.end_place||'—'}`+
          (c.category!==3?`<span class="badge">${catName[c.category]||c.category}</span>`:'')+
          (noStops?`<span class="badge nodata">${T('停留所データ未整備')}</span>`:'')+
          (c.settlement_flag?`<span class="badge pay">${T('納金')}</span>`:'')+`</div></div>`+
        `<div class="time">${c.departure_time||''}</div>`;
      if(selectable) btn.addEventListener('click', ()=> selectCourse(c));
      wrap.appendChild(btn);
      // ③ 次コースとの間が20分以上なら「休憩」を細く表示(到着定刻→次の発車定刻)
      const nx=courses[idx+1];
      if(nx && c.arrival_time && nx.departure_time){
        const a=toMin(c.arrival_time), dp=toMin(nx.departure_time);
        if(a!=null && dp!=null && dp-a>=REST_MIN){ const r=document.createElement('div'); r.className='rest-row'; r.textContent=T('― 休憩 {min}分 ―',{min:dp-a}); wrap.appendChild(r); }
      }
    });
  }

  // コース選択時に三角表を1回だけ取得して保持(以降はオフラインでも表示可)
  async function prefetchFares(c){
    fareData=null;
    if(!c) return;
    try{
      const r=await fetch(`${API_BASE}fares.php?dia_course_id=${c.dia_course_id}&all=1&_=${Date.now()}`, {cache:'no-store'});
      const j=await r.json();
      if(r.ok && !j.error && j.matrix){ fareData=j; }
    }catch(e){ /* 圏外等。押した時に再取得を試みる */ }
  }
  $('fareBtn').addEventListener('click', async ()=>{
    if(!course){ toast(T('コースが選択されていません')); return; }
    $('frTitle').textContent=T('料金一覧');
    $('fareOverlay').classList.add('show');
    if(!fareData){   // 先読みできていなければ、この場で取得を試みる
      $('frBody').innerHTML=`<div class="dl-loading">${T('取得中…')}</div>`;
      await prefetchFares(course);
    }
    renderFares();
  });
  function renderFares(){
    const body=$('frBody');
    if(!fareData || !fareData.matrix){ body.innerHTML=`<div class="dl-loading">${T('運賃データがありません（圏外の場合は電波の届く場所で再度お試しください）')}</div>`; return; }
    const cur=stops[targetIndex];
    // 現在停のseqを、先読みした停留所リストから busstop_id で解決
    let toSeq=0, toName='';
    if(cur && cur.busstop_id && fareData.stops){
      const hit=fareData.stops.find(s=>s.busstop_id===cur.busstop_id);
      if(hit){ toSeq=hit.seq; toName=hit.name; }
    }
    const nameOf=seq=>{ const s=(fareData.stops||[]).find(x=>x.seq===seq); return s?s.name:('停'+seq); };
    const list=(toSeq && fareData.matrix[toSeq]) ? fareData.matrix[toSeq] : null;
    if(!list || !list.length){
      $('frTitle').textContent=T('料金一覧');
      body.innerHTML=`<div class="dl-loading">${fareData.note||T('この停までの運賃データがありません')}</div>`; return;
    }
    $('frTitle').textContent=T('{name} までの運賃',{name:toName||cur&&cur.name||''});
    body.innerHTML=`<div class="fr-note">${T('お客様が乗ったバス停を見てください')}</div>`;
    list.forEach(f=>{
      const row=document.createElement('div'); row.className='dl-row';
      row.innerHTML=`<div class="nb-no">${f.seq}</div><div class="nb-dest">${nameOf(f.seq)}</div><div class="nb-t">${T('{price}円',{price:f.price})}</div>`;
      body.appendChild(row);
    });
  }

  // ---- コース選択→停留所取得→モニター ----
  async function selectCourse(c){
    course=c;
    $('gpsNote').textContent=T('停留所データを取得中…');
    try{
      const r=await fetch(`${API_BASE}course_stops.php?dia_course_id=${c.dia_course_id}&_=${Date.now()}`, {cache:'no-store'});
      if(!r.ok){ alert(T('停留所データ取得エラー: HTTP ')+r.status); return; }
      let j=null;
      try{ j=await r.json(); }catch(pe){ alert(T('停留所データの解析に失敗しました(JSONではない応答)。SW更新のため再読み込みしてください')); return; }
      if(!j || j.error){ alert(T('停留所データ取得エラー: ')+((j&&j.error)||T('不明'))); return; }
      if(!j.stops || !j.stops.length){ alert(T('このコースには停留所データがありません(count=0)')); return; }
      stops=j.stops;
      targetIndex=0; lastAtStopIndex=-1; corrections={};   // 新コースは補正をリセット
      $('monCourse').textContent=`${c.start_place}(${hmColon(stops[0])}) → ${c.end_place}(${hmColon(stops[stops.length-1])})`;
      $('monSub').textContent = c.digital_no ? T('タッチ {touch} ・ デジタル{digital}',{touch:c.touch_no||'—',digital:c.digital_no})
                                            : T('タッチ {touch}',{touch:c.touch_no||'—'});
      buildRail();
      resetMonUI();
      prefetchFares(c);            // 圏外対策: 運賃(三角表)をこの時点で1回だけ取得して保持
      show('scMon');
      showConfirm();   // ① コース選択後に行き先確認ポップアップ(デモも同じ)
    }catch(e){ alert(T('通信エラー: ')+e.message); }
  }

  // ---- 定刻(絶対時刻)算出 ----
  function schedDate(stop){ const p=(stop.scheduled_time||'00:00:00').split(':').map(Number); const d=new Date(); d.setHours(p[0]||0,p[1]||0,p[2]||0,0); return d; }
  function fmtSec(sec){ const s=Math.round(sec); const a=Math.abs(s); const m=Math.floor(a/60), ss=a%60; return `${m}:${String(ss).padStart(2,'0')}`; }
  function hhmm(stop){ const p=(stop.scheduled_time||'').split(':'); return p.length>=2?`${p[0]}:${p[1]}`:'--:--'; }
  function hhmmc(stop){ const p=(stop&&stop.scheduled_time||'').split(':'); return p.length>=2?`${p[0]}${p[1]}`:'----'; }   // ⑥ 0958形式
  function hmColon(stop){ const p=(stop&&stop.scheduled_time||'').split(':'); return p.length>=2?`${+p[0]}:${p[1]}`:'--:--'; }   // ② 7:12形式(ゼロサプレス)

  // ---- 早発判定(現在の壁時計 vs 絶対定刻) ----
  function evaluate(lat,lng,now){
    if(targetIndex>=stops.length) return {state:'finished'};
    const stop=stops[targetIndex];
    const isLast = targetIndex===stops.length-1;
    const remainingSec=(schedDate(stop)-now)/1000;   // >0=定刻前, <=0=定刻以降
    let d=Infinity;
    if(stop.lat!=null && stop.lng!=null && lat!=null) d=distM(lat,lng,stop.lat,stop.lng);
    if(d<=STOP_RADIUS_M){
      lastAtStopIndex=targetIndex;
      if(isLast) return { state:'terminal', stop, remainingSec, d };   // 終点は早発判定せず到着扱い
      if(targetIndex===0 && remainingSec>EARLY_GRACE) return { state:'waiting', stop, remainingSec, d };  // 始発待機
      return { state: remainingSec>EARLY_GRACE ? 'early' : 'ok', stop, remainingSec, d };   // ① 15秒以内は早発としない
    } else {
      if(lastAtStopIndex===targetIndex){
        if(isLast) return { state:'terminal', stop, remainingSec, d };  // 終点からは進めない
        const nextStop = stops[targetIndex+1];   // 発車=半径を外れた → 次を案内
        advance();
        if(nextStop){ if(nameSpeech) speakNext(T(targetIndex===stops.length-1 ? '次は終点、' : '次は、'), yomi(nextStop)); }  // ④/⑦
        if(targetIndex>=stops.length) return {state:'finished'};
        return evaluate(lat,lng,now);
      }
      return { state:'approaching', stop, remainingSec, d };
    }
  }
  function advance(){ if(targetIndex<stops.length){ targetIndex++; lastAtStopIndex=-1; } }

  // ---- 描画 ----
  // ① バス停名: 4文字幅の枠に固定、長い名はCSSアニメで横スクロール(往復)
  let curTargetName=null;
  function setTargetName(name){
    name=name||'';
    if(name===curTargetName) return;   // 同名は継続(再スタートしない)
    curTargetName=name;
    const box=$('targetName'), t=$('tnText');
    t.classList.remove('scroll'); t.textContent=name;   // リセット
    const tw=t.scrollWidth, bw=box.clientWidth;
    if(tw>bw+2){   // ④ 先頭(約4文字)を表示してから左へスクロール(繰り返し)
      const to=-(tw-bw), scrollDist=(tw-bw);
      const dur=Math.max(5, (scrollDist/40)/0.76);   // スクロール部を約40px/s
      t.style.setProperty('--to', to+'px'); t.style.setProperty('--dur', dur+'s');
      void t.offsetWidth; t.classList.add('scroll');
    } else {
      t.style.removeProperty('--to'); t.style.removeProperty('--dur');
    }
  }
  // 「この次 →」行: 1行固定・長い時は自動縮小
  function setNextPrev(text){
    const el=$('nextPrev'); el.textContent=text||''; el.style.fontSize='26px';
    if(text){ const w=el.clientWidth; if(w>0 && el.scrollWidth>w){ el.style.fontSize=Math.max(13, Math.floor(26*w/el.scrollWidth))+'px'; } }
  }
  function resetMonUI(){
    clearStateClasses();
    $('gpsNote').textContent='';   // ② 「停留所データを取得中…」等を消す
    clearTimeout(fxAfter);             // フラッグ消去後の案内が遅れて出るのを止める
    $('nextCourseMsg').className='';   // 前のコースの「次のコース」案内を消す
    $('stateTag').className='state-tag'; $('stateTag').textContent=T('運行前');
    $('diff').className='diff appr'; $('diff').textContent='--:--';
    $('caption').textContent=T('GPS開始 または デモで確認');
    $('targetDist').textContent='';
    terminalAnnounced=false; lastEarlyAnnounce=0; curTargetName=null; earlyIdx=-1; earlyN=0; okAnnouncedIdx=-1; preOkIdx=-1;
    if(stops[0]){ setTargetName(dispName(stops[0])); setEta(hhmm(stops[0])); }
    setNextPrev(stops[1] ? T('次々は {name}（{time}）',{name:stops[1].name,time:hhmm(stops[1])}) : T('次は 終点'));   // ① 最初から次停を表示
    updateRail();
  }
  // 遅れの程度で色分け: 5分以上=黄, 10分以上=橙 (remainingSecは負=遅れ)
  function lateClass(rem){ const m=-rem/60; if(m>=10) return 'o'; if(m>=5) return 'y'; return null; }
  // 遅れの段階(3分未満は無し)。remは負=遅れ。符号は付けず、段階ラベルと色を返す
  function lateStage(rem){ const m=-rem/60; if(m<3) return null; if(m<6) return {label:'ちょい遅れ！',cls:'late-y'}; if(m<10) return {label:'だいぶ遅れ！',cls:'late-o'}; return {label:'大幅遅延！',cls:'late-r'}; }   // ⑪ 10分以上は赤
  function zdia(x){ const n=parseInt(x,10); return isNaN(n)?(x||'—'):String(n); }   // ⑧ ダイヤ番号ゼロサプレス
  function toMin(hm){ const p=(hm||'').split(':'); return p.length>=2 ? (+p[0])*60+(+p[1]) : null; }   // ③ HH:MM→分

  function render(st){
    clearStateClasses();
    const tag=$('stateTag'), diff=$('diff');
    tag.className='state-tag'; diff.className='diff';
    $('targetDist').textContent = (st.d!=null && isFinite(st.d)) ? T('現在地から 約 {d} m',{d:Math.round(st.d)}) : '';   // ② 距離
    const nxt = st.state!=='finished' ? stops[targetIndex+1] : null;
    setNextPrev(st.state==='finished' ? '' : (nxt ? T('次々は {name}（{time}）',{name:nxt.name,time:hhmm(nxt)}) : T('次は 終点')));

    if(st.state==='terminal'){   // ⑦ 終点到着(早発判定しない)
      document.body.classList.add('state-ok');
      tag.classList.add('ok'); tag.textContent=T('🏁 終点に到着');
      diff.classList.add('ok'); diff.textContent='🏁';
      $('caption').textContent=T('終点に到着しました。お疲れさまでした');
      setTargetName(dispName(st.stop)); setEta(hhmm(st.stop)); $('nextPrev').textContent='';
      if(!terminalAnnounced){ speak(T('終点に到着しました。お疲れさまでした')); terminalAnnounced=true; stopRun(); showFinishFx(st.stop);}   // 終点でGPS停止+補正保存+全画面演出
      updateRail(); return;
    }
    if(st.state==='finished'){
      tag.classList.add('appr'); tag.textContent=T('運行終了(全停通過)'); diff.classList.add('appr'); diff.textContent='--:--';
      $('caption').textContent=T('お疲れさまでした'); setTargetName('—'); setEta('--:--'); $('nextPrev').textContent=''; $('targetDist').textContent='';
      updateRail(); return;
    }
    setTargetName(dispName(st.stop));
    setEta(hhmm(st.stop));

    if(st.state==='early'){
      document.body.classList.add('state-early');
      tag.classList.add('early'); tag.textContent=T('🚨 早発注意');
      diff.classList.add('early'); diff.textContent=fmtSec(st.remainingSec);
      $('caption').textContent='';   // 冗長なメッセージは非表示(タグと大きな残り秒で十分)
      preOkIdx=targetIndex;                                                          // 定刻案内の対象に
      if(earlyIdx!==targetIndex){ earlyIdx=targetIndex; earlyN=0; }                  // ⑤ 停留所ごとにカウント
      { const t=Date.now(); if(earlyN<1 && t-lastEarlyAnnounce>4000){ speak(T('早発です')); lastEarlyAnnounce=t; earlyN++; } }  // ⑦ 1回のみ
    } else if(st.state==='ok'){
      const stg=lateStage(st.remainingSec);   // 3分以上の遅れのみ段階表示
      if(stg){ document.body.classList.add('state-'+stg.cls); tag.classList.add(stg.cls); diff.classList.add(stg.cls); tag.textContent=T(stg.label); diff.textContent=fmtSec(st.remainingSec); $('caption').textContent=''; }
      else { document.body.classList.add('state-ok'); tag.classList.add('ok'); diff.classList.add('ok'); tag.textContent=T('✅ 正常運行'); diff.textContent=''; $('caption').textContent=''; }   // 3分未満は差分/文言なし(⑩)
      if(preOkIdx===targetIndex && okAnnouncedIdx!==targetIndex){ okAnnouncedIdx=targetIndex; speak(T('定刻です。')); }  // ②定刻案内(早発だった停/始発地で1回)
    } else if(st.state==='waiting'){   // 始発地は早発警告しない
      tag.classList.add('appr'); tag.textContent=T('🚏 始発 待機');
      diff.classList.add('appr'); diff.textContent=fmtSec(st.remainingSec);
      $('caption').textContent=T('定刻({time})まで待機',{time:hhmm(st.stop)});
      preOkIdx=targetIndex;   // 始発地でも定刻案内の対象に
    } else { // approaching
      // ① 100m手前で定刻より30秒以上早い→注意アナウンス+画面フラッシュ(停ごと1回)
      // ② 終着バス停は到着地でそこに停まるため早発注意は出さない
      if(targetIndex < stops.length-1 &&
         st.d!=null && isFinite(st.d) && st.d<=100 && st.remainingSec>=30 && preEarlyWarnedIdx!==targetIndex){
        preEarlyWarnedIdx=targetIndex; speak(T('早発に注意してください')); flashOnce();
      }
      if(st.remainingSec<0){
        const stg=lateStage(st.remainingSec);   // 3分以上の遅れのみ段階表示
        if(stg){ document.body.classList.add('state-'+stg.cls); tag.classList.add(stg.cls); diff.classList.add(stg.cls); tag.textContent=T(stg.label); diff.textContent=fmtSec(st.remainingSec); $('caption').textContent=''; }
        else { tag.classList.add('appr'); tag.textContent=T('走行中'); diff.classList.add('appr'); diff.textContent=''; $('caption').textContent=''; }   // 3分未満は差分を表示しない
      } else {
        tag.classList.add('appr'); tag.textContent=T('走行中'); diff.classList.add('appr');
        diff.textContent=fmtSec(st.remainingSec);
        $('caption').textContent=T('次まで(到着後に早発判定) 定刻 {time}',{time:hhmm(st.stop)});
      }
    }
    updateRail();
  }
  function buildRail(){ const rail=$('rail'); rail.innerHTML=''; stops.forEach((s,i)=>{ const d=document.createElement('div'); d.className='rdot'; d.dataset.i=i; rail.appendChild(d); }); }
  function updateRail(){
    document.querySelectorAll('.rdot').forEach(d=>{ const i=+d.dataset.i; d.classList.toggle('passed', i<targetIndex); d.classList.toggle('cur', i===targetIndex); const s=stops[i]; d.classList.toggle('fixed', !!(s && corrections[s.busstop_id])); });
    const cur=stops[targetIndex];
    $('railTxt').innerHTML = targetIndex<stops.length
      ? `<span class="rt-count">${targetIndex+1}<span class="rt-sep">/</span>${stops.length}</span><span class="rt-next">${T('次: {name}',{name:cur?cur.name:''})}</span>`
      : `<span class="rt-count">${stops.length}<span class="rt-sep">/</span>${stops.length}</span><span class="rt-next">${T('完了')}</span>`;
  }

  function update(lat,lng,now){ render(evaluate(lat,lng,now)); }

  // ⑥ 画面を1回フラッシュ
  function flashOnce(){ const f=$('flash'); if(!f) return; f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
  // 終点到着: 画面いっぱいのチェッカーフラッグが布のように波打つ演出
  // (縦に並ぶ細い短冊を正弦波でずらし、傾きに応じた陰影を重ねて布の起伏を表現)
  let fxTimer=null, fxRaf=null, fxPat=null, fxStart=0;
  function fxBuildPattern(w,h,cell,pad){
    const c=document.createElement('canvas'); c.width=w; c.height=h+pad*2;
    const g=c.getContext('2d');
    const cols=Math.ceil(w/cell), rows=Math.ceil((h+pad*2)/cell);
    for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
      g.fillStyle=((i+j)%2===0)?'#f5f5f5':'#0d0d0d';
      g.fillRect(i*cell, j*cell, cell+1, cell+1);
    }
    return c;
  }
  function fxDraw(ts){
    const cv=$('fxCanvas'); if(!cv || !$('finishFx').classList.contains('show')){ fxRaf=null; return; }
    const ctx=cv.getContext('2d');
    const dpr=Math.min(2, window.devicePixelRatio||1);
    const W=cv.clientWidth, H=cv.clientHeight;
    if(cv.width!==Math.round(W*dpr) || cv.height!==Math.round(H*dpr)){
      cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
      fxPat=null;
    }
    const pad=Math.round(H*0.28);
    if(!fxPat) fxPat=fxBuildPattern(Math.round(W*dpr), Math.round(H*dpr), Math.round(Math.min(W,H)*dpr/4), Math.round(pad*dpr));   // 市松のマス目(小さいほど細かい)
    if(!fxStart) fxStart=ts;
    const t=(ts-fxStart)/1000;

    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    const step=3;                       // 短冊の幅(px)
    const A1=H*0.075, A2=H*0.035;       // 波の振幅
    for(let x=0; x<W; x+=step){
      const p=x/W;
      const ph1=p*7.5 - t*2.2, ph2=p*3.1 + t*1.5;
      const off=Math.sin(ph1)*A1 + Math.sin(ph2)*A2;
      const slope=Math.cos(ph1)*A1*7.5/W + Math.cos(ph2)*A2*3.1/W;   // 傾き→陰影
      ctx.drawImage(fxPat, Math.round(x*dpr),0, Math.round(step*dpr), fxPat.height,
                            x, -pad + off, step+1, (H+pad*2));
      const shade=Math.max(-1,Math.min(1, slope*2.2));
      if(shade>0){ ctx.fillStyle='rgba(0,0,0,'+(shade*0.45).toFixed(3)+')'; ctx.fillRect(x,0,step+1,H); }
      else if(shade<0){ ctx.fillStyle='rgba(255,255,255,'+((-shade)*0.18).toFixed(3)+')'; ctx.fillRect(x,0,step+1,H); }
    }
    // 中央の文字を読みやすくする薄い暗幕
    const grd=ctx.createRadialGradient(W/2,H/2,H*0.05, W/2,H/2,H*0.55);
    grd.addColorStop(0,'rgba(0,0,0,.55)'); grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
    fxRaf=requestAnimationFrame(fxDraw);
  }
  // 終点後の案内: 次に乗務するコース(実車=category 3)を知らせる。無ければ本日終了。
  function showNextCourseMsg(){
    const el=$('nextCourseMsg'); if(!el) return;
    const list=(courses||[]).filter(c=>c.category===3);
    const idx=course ? list.findIndex(c=>c.dia_course_id===course.dia_course_id) : -1;
    const nx=(idx>=0) ? list[idx+1] : null;
    if(nx){
      const t=(nx.departure_time||'').replace(/^0/,'');   // 07:30 → 7:30
      // ② 今のコースの到着定刻と次の発車定刻の差が20分以上なら休憩を知らせる
      const a=toMin(course && course.arrival_time), dp=toMin(nx.departure_time);
      const rest=(a!=null && dp!=null && dp-a>=REST_MIN) ? (dp-a) : 0;
      el.className='show tap';
      el.innerHTML=(rest?`<div class="nc-rest">${T('☕ {min}分 休憩が入ります',{min:rest})}</div>`:`<div class="nc-lbl">${T('次のコース')}</div>`)+
        `<div class="nc-main">${T('{place} 始発',{place:nx.start_place||'—'})}　<span class="nc-time">${t||'--:--'}</span></div>`+
        `<div class="nc-go">${T('押すと次のコースへ ▶')}</div>`;
      el.onclick=()=> selectCourse(nx);   // ① 押すと次のコースの確認画面へ
      // 読みを固定するため、休憩の案内はかなで指定(「ぶん」「やすみいこい」等の誤読を防ぐ)
      speakParts([].concat(
        rest ? partsOf('{min}ふん、きゅうけいがはいります。',{min:rest},[]) : [],
        partsOf('次のコースは、{place}始発、{time}です',
                {place:nx.start_place||'', time:(lang==='en' ? (t||'') : (t||'').replace(':','時')+'分')},
                ['place'])));
    } else {
      el.className='show end'; el.onclick=null;   // 本日終了時は押しても何もしない
      el.innerHTML=`<div class="nc-lbl">${T('本日のダイヤ')}</div>`+
        `<div class="nc-main"><span class="nc-line">${T('本日のダイヤは終了しました。')}</span>`+
        `<span class="nc-line">${T('お気をつけて車庫へ')}</span><span class="nc-line">${T('お戻りください。')}</span></div>`;
      speak(T('本日のダイヤは終了しました。お気をつけて車庫へお戻りください'));
    }
    fitNcLines(el);
  }
  // 画面幅が狭い端末で各行が収まらない場合だけ文字を縮める(折り返して1文字だけ残るのを防ぐ)
  function fitNcLines(el){
    const main=el.querySelector('.nc-main'); if(!main) return;
    main.style.fontSize='';
    const lines=[...el.querySelectorAll('.nc-line')];
    if(!lines.length) return;
    const base=parseFloat(getComputedStyle(main).fontSize)||18;
    const avail=main.clientWidth;
    let need=0; lines.forEach(l=>{ if(l.scrollWidth>need) need=l.scrollWidth; });
    if(need>avail && avail>0){
      main.style.fontSize=Math.max(13, Math.floor(base*avail/need))+'px';
    }
  }
  function showFinishFx(stop){
    const fx=$('finishFx'); if(!fx) return;
    $('fxSub').textContent = (stop && stop.name) ? `${stop.name}　${T('お疲れさまでした')}` : T('お疲れさまでした');
    fx.classList.remove('out'); fx.classList.add('show');
    fxPat=null; fxStart=0;
    if(!fxRaf) fxRaf=requestAnimationFrame(fxDraw);
    clearTimeout(fxTimer); fxTimer=setTimeout(hideFinishFx, 7000);
  }
  let fxAfter=null;
  function hideFinishFx(){
    const fx=$('finishFx'); if(!fx || !fx.classList.contains('show')) return;
    clearTimeout(fxTimer);
    fx.classList.add('out');
    clearTimeout(fxAfter);
    fxAfter=setTimeout(()=>{ fx.classList.remove('show','out');
      if(fxRaf){ cancelAnimationFrame(fxRaf); fxRaf=null; }            // 非表示中は描画を止める
      showNextCourseMsg();                                             // フラッグの後に次コースを案内
    }, 620);
  }
  ['pointerdown','click'].forEach(ev=> $('finishFx').addEventListener(ev, hideFinishFx));
  // ① 3秒以上停車 & DB座標と10m以上離れていれば 補正ボタンを点滅(地味に通知)
  function checkFixMsg(lat,lng){
    if(mode==='demo'){ $('correctBtn').classList.remove('blink'); return; }   // デモでは座標補正を促さない
    const now=Date.now();
    if(runStartAt && now-runStartAt<FIX_QUIET_MS){ $('correctBtn').classList.remove('blink'); return; }   // ④ 開始直後は通知しない
    if(!stillPos || distM(lat,lng,stillPos.lat,stillPos.lng)>8){ stillPos={lat,lng}; stillSince=now; }   // 8m超で移動とみなしリセット
    const stopped=(now-stillSince)>=3000;
    const s=stops[targetIndex];
    let need=false;
    if(stopped && s && s.lat!=null && !corrections[s.busstop_id]){ const d=distM(lat,lng,s.lat,s.lng); need = d>10 && d<=100; }   // 10m〜100mで停車中(補正済みは除く)
    $('correctBtn').classList.toggle('blink', need);
  }

  // ---- ① 発車カウントダウン(始発地で開始した時) ----
  let depTimer=null, depMinAnn=false, depZeroAnn=false, pendingAutoStart=false;
  const DEPART_NEAR_M = 100;   // 始発地とみなす距離
  function startDepCountdown(){
    stopDepCountdown();
    if(!stops[0]) return;
    const rem0=(schedDate(stops[0]).getTime()-nowMs())/1000;
    if(rem0<=0) return;              // 既に発車時刻を過ぎている→不要
    depMinAnn = rem0<=60;           // 60秒以内で開始したら「1分前」は省略
    depZeroAnn = false;
    depTimer=setInterval(depTick, 200); depTick();
  }
  function stopDepCountdown(){ if(depTimer){ clearInterval(depTimer); depTimer=null; } $('depCount').classList.remove('show'); }
  function depTick(){
    if(targetIndex!==0 || !stops[0]){ stopDepCountdown(); return; }   // 発車して次停へ進んだら終了
    const rem=(schedDate(stops[0]).getTime()-nowMs())/1000;
    if(rem<=60 && !depMinAnn){ depMinAnn=true; speak(T('定刻1分前です')); }
    if(rem<=10 && rem>0){ $('depCountNum').textContent=String(Math.ceil(rem)); $('depCount').classList.add('show'); }
    else { $('depCount').classList.remove('show'); }
    // 通常の判定側で既に「定刻です」を言っていれば重ねて言わない
    if(rem<=0){ if(!depZeroAnn){ depZeroAnn=true; if(okAnnouncedIdx!==0){ okAnnouncedIdx=0; speak(T('定刻です')); } } stopDepCountdown(); }
  }
  // ② 始発地でない場所で開始→現在地に最も近いバス停から開始
  function autoStartTarget(lat,lng){
    const s0=stops[0];
    const d0=(s0&&s0.lat!=null)? distM(lat,lng,s0.lat,s0.lng) : Infinity;
    if(d0<=DEPART_NEAR_M){ targetIndex=0; lastAtStopIndex=-1; updateRail(); startDepCountdown(); return; }   // ① 始発地で開始
    let ni=-1,best=Infinity;
    stops.forEach((s,i)=>{ if(s.lat!=null){ const d=distM(lat,lng,s.lat,s.lng); if(d<best){best=d;ni=i;} } });
    if(ni>=0){ targetIndex=ni; lastAtStopIndex=-1; updateRail(); toast(T('現在地に近い「{name}」から開始します',{name:stops[ni].name})); }
  }

  // ---- GPS ----
  function startGps(){
    if(!navigator.geolocation){ $('gpsNote').textContent=T('GPS非対応端末'); return; }
    $('gpsNote').textContent=T('GPS取得中…');
    watchId=navigator.geolocation.watchPosition(
      p=>{ lastLat=p.coords.latitude; lastLng=p.coords.longitude; $('gpsNote').textContent='';   // 精度表示は不要
           if(pendingAutoStart){ pendingAutoStart=false; autoStartTarget(lastLat,lastLng); }
           update(lastLat,lastLng,new Date()); checkFixMsg(lastLat,lastLng); },
      e=>{ $('gpsNote').textContent=T('位置情報エラー: ')+e.message; },
      { enableHighAccuracy:true, maximumAge:1000, timeout:15000 });
    $('startBtn').textContent=T('停止');
  }
  function stopGps(){ if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; } pendingAutoStart=false; stopDepCountdown(); $('correctBtn').classList.remove('blink'); $('startBtn').textContent=T('開始'); }
  // ⑥ 開始→確認ポップアップ→確認で開始 / ⑫ 停止で補正保存
  function beginRun(){
    pendingAutoStart=true; stillPos=null; preEarlyWarnedIdx=-1; runStartAt=Date.now();
    $('correctBtn').classList.remove('blink');
    speakOpening();
    if(mode==='demo'){ pendingAutoStart=false; demoStart(); } else { startGps(); }
  }
  function showConfirm(){
    if(!course){ beginRun(); return; }
    $('cfCheck').checked=false; $('cfOk').disabled=true;   // ① 毎回チェックし直し
    $('cfHead').textContent = T('ダイヤ {no} ・ {type}',{no:zdia(currentDiaNo),type:T(dayType===1?'平日':'土日祝')});
    $('cfDest').textContent = T('この便は「{dest}」行きです',{dest:course.end_place||'—'});
    $('cfRows').innerHTML =
      `<div class="d-row"><span class="d-k">${T('始発時刻')}</span><span class="d-v">${(course.departure_time||'--:--').replace(/^0/,'')}</span></div>`+
      `<div class="d-row"><span class="d-k">${T('ダイヤ番号')}</span><span class="d-v">${zdia(currentDiaNo)}</span></div>`+
      `<div class="d-row"><span class="d-k">${T('タッチ番号')}</span><span class="d-v">${course.touch_no||'—'}</span></div>`+
      (course.digital_no?`<div class="d-row"><span class="d-k">${T('デジタル番号')}</span><span class="d-v">${course.digital_no}</span></div>`:'');
    $('confirmOverlay').classList.add('show');
  }
  $('cfCheck').addEventListener('change', ()=>{ $('cfOk').disabled = !$('cfCheck').checked; });   // ① チェックで開始可
  $('cfCancel').addEventListener('click', ()=>{ $('confirmOverlay').classList.remove('show'); show('scList'); });   // ① コース選択へ戻る
  $('cfOk').addEventListener('click', ()=>{ if(!$('cfCheck').checked) return; $('confirmOverlay').classList.remove('show'); primeAudio(); beginRun(); });
  // 未保存の補正をDBへ送る。成功しても corrections は消さず saved を立てるだけにして、
  // 補正済みの印(🔴)と「もう一度押して取消」を運行終了後も使えるようにする。
  async function flushCorrections(){
    const ids=Object.keys(corrections).filter(id=>!corrections[id].saved);
    if(!ids.length) return true;
    const fixes=ids.map(id=>({busstop_id:+id, lat:corrections[id].lat, lng:corrections[id].lng}));
    try{
      const r=await fetch(`${API_BASE}update_busstops.php`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({secret:CORRECT_SECRET, fixes})});
      const j=await r.json().catch(()=>({}));
      if(r.ok && j.updated!=null){ ids.forEach(id=> corrections[id].saved=true); toast(T('座標を {n} 件 保存しました',{n:j.updated})); updateRail(); return true; }
      toast(T('座標保存に失敗: ')+((j&&j.error)||('HTTP '+r.status)));
    }catch(e){ toast(T('座標保存の通信に失敗しました')); }
    return false;
  }
  // 保存済みの補正を元の座標に戻す(取消)
  async function revertCorrection(id, origLat, origLng){
    try{
      const r=await fetch(`${API_BASE}update_busstops.php`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({secret:CORRECT_SECRET, fixes:[{busstop_id:+id, lat:origLat, lng:origLng}]})});
      const j=await r.json().catch(()=>({}));
      if(r.ok && j.updated!=null) return true;
      toast(T('取消の保存に失敗: ')+((j&&j.error)||('HTTP '+r.status)));
    }catch(e){ toast(T('取消の通信に失敗しました')); }
    return false;
  }
  function stopRun(){ flushCorrections(); if(mode==='demo') demoStop(); else stopGps(); }
  function isRunning(){ return mode==='demo' ? demoRunning() : watchId!==null; }
  $('startBtn').addEventListener('click', ()=>{
    primeAudio();
    if(isRunning()) stopRun(); else showConfirm();   // ⑥ 確認ポップアップ → 開始
  });
  // ⑫ 補正: 現在地を対象バス停の新座標として一時取得。補正済みの停で再度押すと取消
  function refreshDisp(stop){
    if(demoRunning()) demoTick();
    else if(lastLat!=null) update(lastLat,lastLng,new Date(nowMs()));
    else setTargetName(dispName(stop));
    updateRail();
  }
  $('correctBtn').addEventListener('click', ()=>{
    const stop=stops[targetIndex]; if(!stop){ toast(T('対象バス停がありません')); return; }
    const cur=corrections[stop.busstop_id];
    if(cur){   // 補正済み → 取消(元の座標に戻す。保存済みならDBも元に戻す)
      if(confirm(T('「{name}」の補正を取り消しますか？',{name:stop.name}))){
        const wasSaved=!!cur.saved;
        stop.lat=cur.origLat; stop.lng=cur.origLng; delete corrections[stop.busstop_id];
        if(wasSaved){
          revertCorrection(stop.busstop_id, cur.origLat, cur.origLng)
            .then(ok=> toast(ok?T('「{name}」の補正を取り消しました',{name:stop.name}):T('取消をDBに反映できませんでした')));
        } else { toast(T('「{name}」の補正を取り消しました',{name:stop.name})); }
        refreshDisp(stop);
      }
      return;
    }
    if(!navigator.geolocation){ toast(T('この端末はGPS非対応')); return; }
    toast(T('現在地を取得中…'));
    navigator.geolocation.getCurrentPosition(p=>{
      const lat=p.coords.latitude, lng=p.coords.longitude, acc=p.coords.accuracy;
      if(acc>CORRECT_MAX_ACC){ toast(T('GPS精度が低いため補正できません（±{acc}m・{max}m以内で実施）',{acc:Math.round(acc),max:CORRECT_MAX_ACC})); return; }   // 精度ガード
      corrections[stop.busstop_id]={lat,lng, origLat:stop.lat, origLng:stop.lng, saved:false};   // 元座標も保持
      stop.lat=lat; stop.lng=lng;
      refreshDisp(stop);
      // ③ 終点到着後は運行が終了していて保存の機会が無いため、その場でDBへ保存する
      if(watchId===null){ flushCorrections(); }
      else { toast(T('「{name}」を補正しました・停止時に保存(もう一度押すと取消)',{name:stop.name})); }
    }, e=> toast(T('現在地取得に失敗: ')+e.message), {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  });

  // ---- 手動で対象バス停を前/次へ(⑥) ----
  function refreshAfterNav(){
    if(demoRunning()) return demoTick();
    if(lastLat!=null) return update(lastLat,lastLng,new Date(nowMs()));
    const s=stops[targetIndex]; if(s){ setTargetName(dispName(s)); setEta(hhmm(s)); }
    const nxt=stops[targetIndex+1]; setNextPrev(nxt?T('次々は {name}（{time}）',{name:nxt.name,time:hhmm(nxt)}):T('次は 終点'));
    updateRail();
  }
  $('prevBtn').addEventListener('click', ()=>{ if(targetIndex>0){ targetIndex--; lastAtStopIndex=-1; terminalAnnounced=false; refreshAfterNav(); } });
  $('nextBtn').addEventListener('click', ()=>{ if(targetIndex<stops.length-1){ targetIndex++; lastAtStopIndex=-1; terminalAnnounced=false; refreshAfterNav(); } });

  /* ---- デモ(仮想GPS) --------------------------------------------------
     GPSの代わりに、計算で作った現在地と時刻を本体に流し込む。
     判定・警告・カウントダウンは実GPSとまったく同じ経路を通る。

     ・デモ時計は、開始した時点でコースの発時刻に合わせる
     ・区間の所要時間はダイヤの定刻どおり(=40km/h相当)。
       50km/hなら0.8倍の時間で走る(早着)、30km/hなら1.33倍かかる(遅延)
     ・⏸停車 の間は進まない。時計は進むので、早着したぶんを待てる
     -------------------------------------------------------------------- */
  const DEMO_BASE_KMH = 40;        // ダイヤどおりに走る速度
  const DEMO_DWELL_MS = 20000;     // 各停での停車時間(デモ時間)。倍速でも停留所を飛ばさないために要る
  const DEMO_PRE_MS   = 70000;     // 始発地では発時刻の1分10秒前から始める(1分前の案内とカウントダウンを聞くため)
  let demoTimer=null, demoClock=0, demoLastWall=0;
  let demoIdx=0, demoElapsed=0, demoDwell=0;   // 区間/その区間での経過/停車の残り(デモms)
  let demoKmh=40, demoAccel=10, demoHold=false;

  function demoRunning(){ return demoTimer!==null; }
  function nowMs(){ return demoRunning() ? demoClock : Date.now(); }
  function schedMs(i){ const s=stops[i]; return s ? schedDate(s).getTime() : 0; }
  // 区間iの所要時間(ms)。定刻の所要を基準にして、速度の比で伸び縮みさせる
  function segDur(i){
    const d = schedMs(i+1) - schedMs(i);
    return Math.max(1000, d) * (DEMO_BASE_KMH / demoKmh);
  }
  // 実際に走っている時間。停車ぶんを引く(停車は定刻の所要に含まれているため)
  function travelDur(i){ return Math.max(1000, segDur(i) - DEMO_DWELL_MS); }
  // いまのバスの位置(停留所間を直線で補間)
  function demoPos(){
    const a=stops[demoIdx], b=stops[demoIdx+1];
    if(!a) return null;
    if(!b || a.lat==null || b.lat==null) return (a.lat!=null)?{lat:a.lat,lng:a.lng}:null;
    const f=Math.max(0,Math.min(1, demoElapsed/travelDur(demoIdx)));
    return { lat:a.lat+(b.lat-a.lat)*f, lng:a.lng+(b.lng-a.lng)*f };
  }
  function demoStart(){
    if(!stops.length){ toast(T('停留所データがありません')); return; }
    demoIdx = Math.max(0, Math.min(targetIndex, stops.length-1));
    const atOrigin = (demoIdx===0);
    demoElapsed = 0; demoHold = false;
    // 始発地なら発時刻の少し前から。その間は停車させ、定刻ちょうどに発車させる
    demoDwell = atOrigin ? DEMO_PRE_MS : DEMO_DWELL_MS;
    demoClock = schedMs(demoIdx) - (atOrigin ? DEMO_PRE_MS : 0);
    demoLastWall = Date.now();
    demoAccel = parseInt($('demoAccel').value,10)||1;
    updateHoldBtn();
    demoTimer = setInterval(demoTick, 200);
    $('startBtn').textContent=T('停止');
    if(atOrigin) startDepCountdown();      // 1分前の案内と10秒からのカウントダウン
    demoTick();
  }
  function demoStop(){
    if(demoTimer){ clearInterval(demoTimer); demoTimer=null; }
    demoHold=false; updateHoldBtn();      // 停止したら「停車」表示に戻す
    stopDepCountdown();
    $('startBtn').textContent=T('開始');
  }
  function demoTick(){
    const wall=Date.now();
    const dt=(wall-demoLastWall)*demoAccel;   // 進んだデモ時間(ms)
    demoLastWall=wall;
    demoClock += dt;
    if(!demoHold) demoAdvance(dt);
    const p=demoPos();
    if(p){ lastLat=p.lat; lastLng=p.lng; update(p.lat,p.lng,new Date(demoClock)); }
    renderDemoBar();
  }
  // 経過ぶんだけ進める。停留所に着いたらそこで少し停まる(飛び越さないため)
  function demoAdvance(dt){
    let guard=0;
    while(dt>0 && guard++<500){
      if(demoDwell>0){ const u=Math.min(dt,demoDwell); demoDwell-=u; dt-=u; continue; }
      if(demoIdx >= stops.length-1){ demoElapsed=0; return; }      // 終点
      const need=travelDur(demoIdx)-demoElapsed;
      if(dt < need){ demoElapsed+=dt; return; }
      dt-=need; demoIdx++; demoElapsed=0;
      if(demoIdx < stops.length-1) demoDwell=DEMO_DWELL_MS;        // 次の停留所で停車
    }
  }
  function renderDemoBar(){
    const d=new Date(demoClock);
    const two=n=>String(n).padStart(2,'0');
    $('demoClock').textContent=`${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`;
    const s=stops[targetIndex];
    const el=$('demoDiff'); el.className='demo-diff';
    if(!s){ el.textContent=''; return; }
    const diff=Math.round((demoClock - schedMs(targetIndex))/1000);   // +遅れ / −早発
    const m=Math.floor(Math.abs(diff)/60), ss=Math.abs(diff)%60;
    const amt = m ? T('{m}分{s}秒',{m:m,s:two(ss)}) : T('{s}秒',{s:ss});
    el.textContent = T('定刻 {time} / ',{time:hhmm(s)}) + (diff===0 ? T('ちょうど') : (diff<0 ? T('{amt} 早い',{amt}) : T('{amt} 遅い',{amt})));
    if(diff<=-10) el.classList.add('early'); else if(diff>=60) el.classList.add('late');
  }
  function updateHoldBtn(){
    const b=$('demoHoldBtn'); if(!b) return;
    b.textContent = T(demoHold ? '▶ 発車' : '⏸ 停車');
    b.classList.toggle('on', demoHold);
  }
  $('demoHoldBtn').addEventListener('click', ()=>{ demoHold=!demoHold; updateHoldBtn(); if(demoRunning()) demoTick(); });
  $('demoAccel').addEventListener('change', ()=>{ demoAccel=parseInt($('demoAccel').value,10)||1; demoLastWall=Date.now(); });
  document.querySelectorAll('.spd').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.spd').forEach(x=>x.classList.toggle('on', x===b));
      demoKmh=parseInt(b.dataset.kmh,10)||40;
      // 速度を変えても、いま走っている位置は動かさない(経過の割合を保つ)
      if(demoRunning() && demoIdx<stops.length-1){
        const f=Math.max(0,Math.min(1, demoElapsed/travelDur(demoIdx)));
        demoElapsed = f*travelDur(demoIdx);
        demoTick();
      }
    });
  });

  // 設定画面の 実GPS / デモ 切替
  function setMode(m){
    mode=m; lsSet('mon_mode', m);
    $('mdGps').classList.toggle('active', m==='gps');
    $('mdDemo').classList.toggle('active', m==='demo');
    $('demoRow').style.display = (m==='demo') ? 'flex' : 'none';
  }
  $('mdGps').addEventListener('click', ()=>{ if(demoRunning()) demoStop(); setMode('gps'); });
  $('mdDemo').addEventListener('click', ()=>{ stopGps(); setMode('demo'); });
  setMode(lsGet('mon_mode')==='demo' ? 'demo' : 'gps');

  // ---- ③ 音量(大/中/小/消 の4段) ----
  function updateVolBtn(){ $('volBtn').textContent = T(VOL_LABEL[volLevel]); }
  $('volBtn').addEventListener('click', ()=>{
    volLevel=(volLevel+1)%4; lsSet('mon_vol',String(volLevel)); updateVolBtn();
    if(VOL[volLevel]>0){ primeAudio(); speak(T('音量'+['大','中','小'][volLevel])); }
  });
  updateVolBtn();

  // ---- バス停名の読み上げ ON/OFF ----
  function updateNameBtn(){ const b=$('nameBtn'); b.textContent=T((nameSpeech?'🗣':'🔇')+'停名'); b.classList.toggle('off',!nameSpeech); }
  $('nameBtn').addEventListener('click', ()=>{
    nameSpeech=!nameSpeech; lsSet('mon_name_speech', nameSpeech?'1':'0'); updateNameBtn();
    if(nameSpeech){ primeAudio(); speak(T('停留所名の読み上げオン')); }
  });
  updateNameBtn();

  // ---- 判定半径プルダウン(5m刻み・既定20m・localStorage保存) ----
  (function initRadius(){
    const r=$('radius');
    for(let m=5;m<=60;m+=5){ const o=document.createElement('option'); o.value=m; o.textContent=m+' m'; if(m===STOP_RADIUS_M) o.selected=true; r.appendChild(o); }
    r.addEventListener('change', ()=>{
      STOP_RADIUS_M=parseInt(r.value,10); lsSet('mon_radius',String(STOP_RADIUS_M));
      if(demoRunning()) demoTick();
    });
  })();

  // ---- ⑨ オープニング: タップでアニメ+ファンファーレを同時再生(iOSの自動再生制限に対応) ----
  function scheduleFanfare(ctx){
    try{
      const master=ctx.createGain(); master.gain.value=0.6; master.connect(ctx.destination);
      const note=(f,s,d,v)=>{
        const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain();
        o.type='sawtooth'; o2.type='square'; o.frequency.value=f; o2.frequency.value=f; o2.detune.value=7;
        g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(v,s+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001,s+d);
        o.connect(g); o2.connect(g); g.connect(master);
        o.start(s); o2.start(s); o.stop(s+d+0.05); o2.stop(s+d+0.05);
      };
      const C5=523.25,G4=392,E5=659.25,G5=784,C6=1046.5;
      let t=ctx.currentTime+0.12;
      note(C5,t,0.16,0.45); t+=0.17;
      note(G4,t,0.12,0.40); t+=0.14;
      note(C5,t,0.12,0.45); t+=0.16;
      note(E5,t,0.20,0.50); t+=0.22;
      note(G5,t,0.50,0.55); t+=0.55;
      note(C5,t,1.1,0.30); note(E5,t,1.1,0.32); note(G5,t,1.1,0.36); note(C6,t,1.1,0.30);
      return 2700;  // 音源の長さ(ms)
    }catch(e){ return 2700; }
  }
  (function opening(){
    const splash=$('splash'); if(!splash) return;
    const hint=$('splashHint');
    let started=false;
    function hideSplash(){ splash.classList.add('hide'); setTimeout(()=>{ if(splash.parentNode) splash.remove(); }, 600); }
    function go(){
      if(started) return; started=true;
      if(hint) hint.style.display='none';
      splash.classList.add('play');            // アニメ開始
      setTimeout(hideSplash, 2700);            // 遷移は音に依存せず必ず実行
      // ⑨ 起動音: 事前生成した音源を再生(iOSでも確実。読み上げと同じHTMLメディア経由)
      try{ const a=$('bgm'); if(a){ a.volume=1.0; a.currentTime=0; const pr=a.play(); if(pr && pr.catch) pr.catch(()=>{}); } }catch(e){}
    }
    ['pointerdown','touchstart','click'].forEach(ev=>{ splash.addEventListener(ev, go); document.addEventListener(ev, go); });
    setTimeout(go, 10000);                      // 保険: 無操作でも10秒で必ず進む
  })();

  // ---- ⑧ 下スワイプの引っ張り更新を抑止(最上部で下方向のみ) ----
  let ptStartY=0;
  document.addEventListener('touchstart', e=>{ if(e.touches[0]) ptStartY=e.touches[0].clientY; }, {passive:true});
  document.addEventListener('touchmove', e=>{
    if(!e.touches[0]) return;
    const el=document.scrollingElement||document.documentElement;
    if(el.scrollTop<=0 && e.touches[0].clientY>ptStartY){ e.preventDefault(); }
  }, {passive:false});

  // ---- Service Worker ----
  if('serviceWorker' in navigator && location.protocol==='https:'){
    window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
  scanStaticTexts();
  $('langBtn').addEventListener('click', toggleLang);
  applyLang();
})();
</script>
