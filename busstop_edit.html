<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="バス停エディタ">
<title>バス停エディタ</title>
<style>
  :root{
    --bg:#0e1116; --panel:#171b22; --panel-2:#1e232c; --line:#2a303a;
    --ink:#f2f5f8; --ink-dim:#9aa4b2; --ink-faint:#6b7686;
    --accent:#4da3ff; --ok:#37c871; --warn:#f4b740; --danger:#ef5350;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); overscroll-behavior-y:none; touch-action:manipulation; }
  button, select, input{ touch-action:manipulation; font-family:var(--sans); }
  /* オープニング(ドラサポと同様) */
  #splash{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 38%, #143a72, #0a1020 72%); overflow:hidden; }
  #splash.hide{ opacity:0; visibility:hidden; transition:opacity .5s ease, visibility .5s; }
  #splash.play::before{ content:""; position:absolute; top:-60%; left:-30%; width:60%; height:220%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); transform:rotate(18deg);
    animation:sweep 1.4s ease-in-out .3s; }
  @keyframes sweep{ 0%{ left:-40%; } 100%{ left:120%; } }
  .splash-inner{ text-align:center; }
  .splash-logo{ font-size:76px; opacity:0; }
  .splash-title{ font-size:44px; font-weight:900; letter-spacing:.08em; margin-top:4px;
    background:linear-gradient(90deg,#fff,#8fd0ff,#fff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:#fff; opacity:0; }
  .splash-sub{ font-size:14px; color:#9fb6d8; margin-top:10px; letter-spacing:.14em; opacity:0; }
  .splash-hint{ margin-top:28px; font-size:15px; color:#cfe0f5; letter-spacing:.06em; animation:hintPulse 1.2s ease-in-out infinite; }
  .splash-copy{ position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 22px); text-align:center; font-size:11px; color:#7f97b8; letter-spacing:.03em; }
  #splash.play .splash-logo{ animation:logoIn 1s cubic-bezier(.2,1.4,.35,1) both; }
  #splash.play .splash-title{ animation:titleIn .8s .35s both; }
  #splash.play .splash-sub{ animation:titleIn .8s .6s both; }
  #splash.play .splash-hint{ display:none; }
  @keyframes hintPulse{ 0%,100%{ opacity:.4; } 50%{ opacity:1; } }
  @keyframes logoIn{ 0%{ transform:scale(.2) rotate(-25deg); opacity:0; } 100%{ transform:scale(1) rotate(0); opacity:1; } }
  @keyframes titleIn{ 0%{ transform:translateY(14px); opacity:0; } 100%{ transform:translateY(0); opacity:1; } }

  .screen{ display:none; min-height:100vh; flex-direction:column; }
  .screen.active{ display:flex; }
  .gpsrow{ display:flex; gap:10px; align-items:stretch; }
  .gpsrow .btn{ flex:1; }
  .gpsdist{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:96px; padding:6px 10px; border:1px solid var(--line); border-radius:11px; background:var(--panel); text-align:center; }
  .gpsdist .lb{ font-size:10px; color:var(--ink-faint); }
  .gpsdist .v{ font-family:var(--mono); font-size:16px; font-weight:800; color:var(--ink); }

  .topbar{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  .title{ font-size:17px; font-weight:800; }
  #homeTitle{ cursor:pointer; }
  #homeTitle:active{ opacity:.6; }
  .tcount{ font-size:13px; font-weight:600; color:var(--ink-dim); margin-left:4px; }
  .item .nm .n .dir{ font-size:12px; font-weight:600; color:var(--ink-faint); margin-left:4px; }
  .clock{ font-family:var(--mono); font-size:13px; color:var(--ink-dim); }

  .searchwrap{ padding:10px 12px 6px; }
  .searchwrap input{ width:100%; background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:12px 12px; font-size:16px; }
  .modebar{ display:flex; gap:8px; padding:4px 12px 8px; }
  .modebar button{ flex:1; padding:10px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink-dim); font-size:14px; font-weight:700; }
  .modebar button.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

  .rowsel{ display:flex; flex-wrap:wrap; gap:6px; padding:0 12px 8px; }
  .rowsel button{ min-width:42px; flex:1; padding:10px 4px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); font-size:16px; font-weight:700; }
  .rowsel button.active{ background:var(--accent); color:#04121f; border-color:var(--accent); }

  .listinfo{ padding:2px 16px 6px; font-size:12px; color:var(--ink-faint); }
  .list{ flex:1; overflow-y:auto; padding:0 12px 20px; }
  .item{ width:100%; text-align:left; display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:8px; color:var(--ink); }
  .item .nm{ flex:1; min-width:0; }
  .item .nm .n{ font-size:16px; font-weight:700; line-height:1.25; }
  .item .nm .k{ font-size:12px; color:var(--ink-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap; }
  .badge.ok{ background:rgba(55,200,113,.15); color:var(--ok); }
  .badge.no{ background:rgba(244,183,64,.15); color:var(--warn); }
  .badge.dist{ background:var(--panel-2); color:var(--ink); font-family:var(--mono); font-size:16px; font-weight:800; letter-spacing:.3px; padding:5px 10px; }
  .empty{ text-align:center; color:var(--ink-faint); padding:30px 12px; }

  /* 詳細 */
  .detail{ flex:1; overflow-y:auto; padding:14px 14px 24px; }
  .d-name{ font-size:24px; font-weight:800; line-height:1.2; }
  .d-kana{ font-size:15px; color:var(--ink-dim); margin-top:4px; }
  .d-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:14px; }
  .d-row{ display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line); }
  .d-row:last-child{ border-bottom:none; }
  .d-k{ font-size:13px; color:var(--ink-dim); }
  .d-v{ font-size:16px; font-weight:700; font-family:var(--mono); text-align:right; }
  .d-v.na{ color:var(--warn); font-family:var(--sans); }
  .d-v.chg{ color:var(--accent); }
  .fld{ margin-top:14px; }
  .fld label{ display:block; font-size:13px; color:var(--ink-dim); margin-bottom:6px; }
  .fld input{ width:100%; background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:12px; font-size:18px; }
  a.btn.dis{ pointer-events:none; }
  .mapbox{ width:100%; height:260px; border-radius:12px; overflow:hidden; margin-top:12px; border:1px solid var(--line); background:var(--panel-2); }
  .mapmsg{ display:flex; align-items:center; justify-content:center; height:100%; padding:16px; text-align:center; font-size:13px; color:var(--ink-faint); line-height:1.6; }
  .maphint{ font-size:12px; color:var(--ink-faint); margin-top:6px; }
  .d-actions{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .btn{ display:block; text-align:center; text-decoration:none; padding:14px; border-radius:11px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); font-size:15px; font-weight:700; }
  .btn.pri{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .btn.dis{ opacity:.5; }
  .note{ font-size:12px; color:var(--ink-faint); margin-top:12px; line-height:1.6; }
  .controls{ display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); }
  .controls button{ flex:1; padding:14px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); font-size:15px; font-weight:700; }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:#000; color:#fff; padding:10px 16px; border-radius:20px; font-size:14px; opacity:0; transition:.25s; pointer-events:none; z-index:50; max-width:90%; text-align:center; }
  .toast.show{ opacity:.95; transform:translateX(-50%) translateY(0); }
</style>

<!-- ===== オープニング ===== -->
<div id="splash">
  <div class="splash-inner">
    <div class="splash-logo">🚏</div>
    <div class="splash-title">バス停エディタ</div>
    <div class="splash-sub">しまバス バス停 座標・フリガナ 編集</div>
    <div class="splash-hint" id="splashHint">画面をタップしてスタート</div>
  </div>
  <div class="splash-copy">©2026 Hillsfactory　Powered by Claude</div>
</div>

<!-- ===== 一覧/検索/いまここ ===== -->
<div class="screen active" id="scList">
  <div class="topbar"><div class="title" id="homeTitle" role="button" title="最初の画面に戻る">🚏 バス停エディタ<span class="tcount" id="stopCount"></span></div><div class="clock" id="clock">--:--:--</div></div>
  <div class="searchwrap"><input type="search" id="searchBox" placeholder="漢字・フリガナで検索（曖昧）" autocomplete="off" inputmode="search"></div>
  <div class="modebar">
    <button id="modeAiu" class="active">五十音</button>
    <button id="modeHere">いまここ</button>
  </div>
  <div class="rowsel" id="rowSel"></div>
  <div class="listinfo" id="listInfo">読み込み中…</div>
  <div class="list" id="listArea"></div>
</div>

<!-- ===== 詳細 ===== -->
<div class="screen" id="scDetail">
  <div class="topbar"><div class="title">バス停 詳細</div><div class="clock" id="clock2">--:--:--</div></div>
  <div class="detail" id="detailArea"></div>
  <div class="controls"><button id="backBtn">← 一覧へ戻る</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const API_BASE = (location.origin === 'https://tokyoknock.com') ? 'api/' : 'https://tokyoknock.com/bus/api/';
  const CORRECT_SECRET = 'shimabus-fix-2026';   // update_busstops.php の SECRET と一致
  // ★Google Maps JS API キー(HTTPリファラ制限を推奨: tokyoknock.com/*, *.github.io/*)。未設定なら地図は無効・GPS編集は可
  const MAPS_API_KEY = 'AIzaSyDang0KukZgL3DamNwX9ZXaLKLpyznl0-I';
  const DEFAULT_CENTER = { lat: 28.377, lng: 129.493 };   // 座標未登録時の初期表示(奄美市名瀬付近)
  const $ = id => document.getElementById(id);

  // ---- Google Maps 遅延ロード ----
  let mapsReady=false, mapsFailed=false, mapsLoading=null, gmap=null, gmarker=null;
  function loadMaps(){
    if(mapsReady) return Promise.resolve(true);
    if(mapsFailed) return Promise.resolve(false);
    if(mapsLoading) return mapsLoading;
    if(!MAPS_API_KEY || MAPS_API_KEY.indexOf('__')===0){ mapsFailed=true; return Promise.resolve(false); }
    mapsLoading = new Promise(res=>{
      window.__mapsCb = ()=>{ mapsReady=true; res(true); };
      const s=document.createElement('script');
      s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(MAPS_API_KEY)}&callback=__mapsCb&loading=async`;
      s.async=true; s.defer=true;
      s.onerror=()=>{ mapsFailed=true; res(false); };
      document.head.appendChild(s);
    });
    return mapsLoading;
  }

  let stops = [];          // 全バス停
  let mode = 'aiu';        // 'aiu' | 'here'
  let curRow = 'あ';       // 五十音の選択行
  let hereList = [];       // いまここの近傍結果
  let current = null;      // 詳細対象
  let pendLat = null, pendLng = null, pendAcc = null, saving = false;   // 編集中の座標(GPS取得値)
  let regLat = null, regLng = null;   // 詳細を開いた時点の登録座標(DB値)
  let myPos = null;        // 端末の現在地 {lat,lng,acc}
  function acquireMyPos(cb){
    if(!navigator.geolocation){ if(cb)cb(false); return; }
    navigator.geolocation.getCurrentPosition(p=>{
      myPos={lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy}; if(cb)cb(true);
    }, e=>{ if(cb)cb(false); }, {enableHighAccuracy:true, timeout:15000, maximumAge:30000});
  }

  const ROWS = ['あ','か','さ','た','な','は','ま','や','ら','わ','他'];

  // ---- 時計 ----
  function tickClock(){ const t=new Date().toLocaleTimeString('ja-JP',{hour12:false}); $('clock').textContent=t; const c2=$('clock2'); if(c2)c2.textContent=t; }
  setInterval(tickClock,1000); tickClock();

  let toastT=null;
  function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2400); }
  function show(id){ ['scList','scDetail'].forEach(s=>$(s).classList.toggle('active', s===id)); }

  // ---- カナ正規化 ----
  function kataToHira(s){ return (s||'').replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
  const SMALL={'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','ゃ':'や','ゅ':'ゆ','ょ':'よ','っ':'つ','ゎ':'わ','ゕ':'か','ゖ':'け'};
  const ROWOF={
    'あ':'あ','い':'あ','う':'あ','え':'あ','お':'あ',
    'か':'か','き':'か','く':'か','け':'か','こ':'か',
    'さ':'さ','し':'さ','す':'さ','せ':'さ','そ':'さ',
    'た':'た','ち':'た','つ':'た','て':'た','と':'た',
    'な':'な','に':'な','ぬ':'な','ね':'な','の':'な',
    'は':'は','ひ':'は','ふ':'は','へ':'は','ほ':'は',
    'ま':'ま','み':'ま','む':'ま','め':'ま','も':'ま',
    'や':'や','ゆ':'や','よ':'や',
    'ら':'ら','り':'ら','る':'ら','れ':'ら','ろ':'ら',
    'わ':'わ','を':'わ','ん':'わ'
  };
  function rowOf(kana){
    if(!kana) return '他';
    let c = kataToHira(kana.trim()).normalize('NFD')[0] || '';
    c = SMALL[c] || c;
    return ROWOF[c] || '他';
  }
  function normSearch(s){ return kataToHira((s||'').normalize('NFKC')).replace(/\s+/g,'').toLowerCase(); }
  function dirTag(d){ return d===1?'（上り）':d===2?'（下り）':d===9?'（他）':''; }
  function sortKey(st){ return kataToHira(st.kana||'') || ('￿'+(st.name||'')); }   // カナ無しは末尾

  // ---- データ取得(admin優先・無ければ busstops.php にフォールバック) ----
  async function load(){
    $('listInfo').textContent='読み込み中…';
    let data=null;
    try{
      const r=await fetch(`${API_BASE}busstops_admin.php?_=${Date.now()}`,{cache:'no-store'});
      if(r.ok) data=await r.json();
    }catch(e){}
    if(!data || !data.stops){
      try{
        const r2=await fetch(`${API_BASE}busstops.php?_=${Date.now()}`,{cache:'no-store'});
        if(r2.ok){ data=await r2.json(); if(data.stops) data.stops.forEach(s=>{ s.has_coord=(s.lat!=null&&s.lng!=null); }); }
      }catch(e){}
    }
    if(!data || !data.stops){ $('listInfo').textContent='データの取得に失敗しました'; return; }
    stops = data.stops;
    $('stopCount').textContent = `（${stops.length}件）`;
    render();
  }

  // ---- 距離(Haversine, m) ----
  function distM(la1,lo1,la2,lo2){ const R=6371000,r=Math.PI/180; const dla=(la2-la1)*r,dlo=(lo2-lo1)*r; const a=Math.sin(dla/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dlo/2)**2; return 2*R*Math.asin(Math.sqrt(a)); }
  function fmtDist(m){ return m>=1000 ? (m/1000).toFixed(m>=10000?0:1)+'km' : Math.round(m)+'m'; }

  // ---- 描画 ----
  function itemEl(st, distText){
    const b=document.createElement('button'); b.className='item';
    if(!distText && myPos && st.has_coord) distText = fmtDist(distM(myPos.lat,myPos.lng,st.lat,st.lng));   // ② 現在地→登録座標の距離
    const badge = distText ? `<span class="badge dist">${distText}</span>`
                : (st.has_coord ? '<span class="badge ok">📍座標あり</span>' : '<span class="badge no">⚠未登録</span>');
    b.innerHTML = `<div class="nm"><div class="n">${esc(st.name||'—')}<span class="dir">${dirTag(st.direction)}</span></div><div class="k">${esc(st.kana||'（カナ未登録）')}</div></div>${badge}`;
    b.addEventListener('click', ()=>openDetail(st));
    return b;
  }
  function esc(s){ return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function render(){
    const q = normSearch($('searchBox').value);
    $('rowSel').style.display = (mode==='aiu' && !q) ? 'flex' : 'none';
    const area=$('listArea'); area.innerHTML='';

    if(q){   // 検索モード(曖昧)
      const res = stops.filter(s=> normSearch(s.name).includes(q) || normSearch(s.kana).includes(q))
                       .sort((a,b)=> sortKey(a).localeCompare(sortKey(b),'ja'));
      $('listInfo').textContent = `検索「${$('searchBox').value.trim()}」: ${res.length}件`;
      if(!res.length){ area.innerHTML='<div class="empty">該当なし</div>'; return; }
      res.slice(0,300).forEach(s=> area.appendChild(itemEl(s)));
      return;
    }
    if(mode==='here'){
      $('listInfo').textContent = hereList.length ? `現在地から近い順 ${hereList.length}件` : '「いまここ」で現在地を取得してください';
      if(!hereList.length){
        const b=document.createElement('button'); b.className='btn pri'; b.textContent='📍 現在地を取得して近くのバス停を探す';
        b.addEventListener('click', getHere); area.appendChild(b);
        return;
      }
      const b=document.createElement('button'); b.className='btn'; b.textContent='📍 現在地を取り直す'; b.style.marginBottom='10px';
      b.addEventListener('click', getHere); area.appendChild(b);
      hereList.forEach(x=> area.appendChild(itemEl(x.st, fmtDist(x.d))));
      return;
    }
    // 五十音
    renderRowSel();
    const res = stops.filter(s=> rowOf(s.kana)===curRow).sort((a,b)=> sortKey(a).localeCompare(sortKey(b),'ja'));
    $('listInfo').textContent = `${curRow}行: ${res.length}件`;
    if(!res.length){ area.innerHTML='<div class="empty">この行のバス停はありません</div>'; return; }
    res.forEach(s=> area.appendChild(itemEl(s)));
  }

  function renderRowSel(){
    const sel=$('rowSel'); sel.innerHTML='';
    ROWS.forEach(r=>{ const b=document.createElement('button'); b.textContent=r; if(r===curRow) b.classList.add('active');
      b.addEventListener('click', ()=>{ curRow=r; render(); $('listArea').scrollTop=0; }); sel.appendChild(b); });
  }

  function getHere(){
    if(!navigator.geolocation){ toast('この端末はGPS非対応です'); return; }
    toast('現在地を取得中…');
    navigator.geolocation.getCurrentPosition(p=>{
      const la=p.coords.latitude, lo=p.coords.longitude;
      myPos={lat:la, lng:lo, acc:p.coords.accuracy};
      hereList = stops.filter(s=>s.has_coord).map(s=>({st:s, d:distM(la,lo,s.lat,s.lng)}))
                      .sort((a,b)=>a.d-b.d).slice(0,10);
      toast(`現在地取得(±${Math.round(p.coords.accuracy)}m)`);
      render();
    }, e=> toast('現在地の取得に失敗: '+e.message), {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  }

  // ---- 詳細(編集) ----
  const DIR={1:'上り',2:'下り',9:'その他'};
  function openDetail(st){
    current=st; pendLat=st.lat; pendLng=st.lng; regLat=st.lat; regLng=st.lng; pendAcc=null; saving=false;
    $('detailArea').innerHTML =
      `<div class="d-name">${esc(st.name||'—')}<span class="dir">${dirTag(st.direction)}</span></div>`+
      `<div class="d-card">`+
        `<div class="d-row"><span class="d-k">バス停ID</span><span class="d-v">${st.busstop_id}</span></div>`+
        `<div class="d-row"><span class="d-k">方向</span><span class="d-v">${DIR[st.direction]||'—'}</span></div>`+
      `</div>`+
      `<div class="fld"><label>フリガナ</label><input type="text" id="editKana" value="${esc(st.kana||'')}" placeholder="ひらがな/カタカナ" autocomplete="off"></div>`+
      `<div class="mapbox" id="mapBox"><div class="mapmsg">地図を準備中…</div></div>`+
      `<div class="maphint">地図のピンをドラッグ、または地図をタップで位置を指定できます。</div>`+
      `<div class="d-card" style="margin-top:12px;">`+
        `<div class="d-row"><span class="d-k">緯度</span><span class="d-v" id="dispLat"></span></div>`+
        `<div class="d-row"><span class="d-k">経度</span><span class="d-v" id="dispLng"></span></div>`+
        `<div class="d-row" id="rowAcc" style="display:none;"><span class="d-k">GPS精度</span><span class="d-v" id="dispAcc"></span></div>`+
      `</div>`+
      `<div class="d-actions">`+
        `<div class="gpsrow">`+
          `<button class="btn" id="gpsSet">📍 現在地(GPS)で座標を設定</button>`+
          `<div class="gpsdist"><span class="lb">現在地との差</span><span class="v" id="gpsDistV">—</span></div>`+
        `</div>`+
        `<a class="btn" id="gmapLink" target="_blank" rel="noopener">🗺 Googleマップで開く</a>`+
        `<a class="btn" id="routeLink" target="_blank" rel="noopener">🚗 経路案内（現在地→ここ・道なり）</a>`+
        `<button class="btn pri" id="saveBtn">💾 保存（DBへ反映）</button>`+
      `</div>`+
      `<div class="note">「現在地との差」は端末の現在地と登録済み座標の距離です。座標は「地図ピンのドラッグ/タップ」または「現在地(GPS)で設定」で更新します。保存はドラサポと共通のDBへ反映されます。</div>`;
    refreshCoordDisp(); updateGpsDist();
    $('gpsSet').addEventListener('click', gpsSetCoord);
    $('saveBtn').addEventListener('click', saveEdit);
    show('scDetail'); $('detailArea').scrollTop=0;
    initMap();
    if(!myPos) acquireMyPos(ok=>{ if(ok) updateGpsDist(); });
  }
  function updateGpsDist(){
    const el=$('gpsDistV'); if(!el) return;
    if(!myPos){ el.textContent='位置未取得'; return; }
    if(regLat==null||regLng==null){ el.textContent='登録なし'; return; }
    el.textContent = fmtDist(distM(myPos.lat,myPos.lng,regLat,regLng));
  }
  function refreshCoordDisp(){
    const has = pendLat!=null && pendLng!=null;
    const changed = has && (pendLat!==current.lat || pendLng!==current.lng);
    $('dispLat').textContent = has ? pendLat.toFixed(6) : '未登録';
    $('dispLng').textContent = has ? pendLng.toFixed(6) : '未登録';
    $('dispLat').className = 'd-v' + (has?'':' na') + (changed?' chg':'');
    $('dispLng').className = 'd-v' + (has?'':' na') + (changed?' chg':'');
    if(pendAcc!=null){ $('rowAcc').style.display='flex'; $('dispAcc').textContent='±'+Math.round(pendAcc)+'m'+(changed?'（新規取得）':''); }
    else { $('rowAcc').style.display='none'; }
    const link=$('gmapLink');
    if(has){ link.classList.remove('dis'); link.href=`https://www.google.com/maps/search/?api=1&query=${pendLat},${pendLng}`; }
    else { link.classList.add('dis'); link.removeAttribute('href'); }
    const rt=$('routeLink');   // 現在地→バス停の道なり経路(Googleマップで開く・無料)
    if(rt){
      if(has){ rt.classList.remove('dis'); rt.href=`https://www.google.com/maps/dir/?api=1&destination=${pendLat},${pendLng}&travelmode=driving`; }
      else { rt.classList.add('dis'); rt.removeAttribute('href'); }
    }
  }
  // 地図/GPS から座標を反映
  function setPend(la,lo,acc){ pendLat=+(+la).toFixed(6); pendLng=+(+lo).toFixed(6); pendAcc=(acc==null?null:acc); refreshCoordDisp(); }
  async function initMap(){
    const box=$('mapBox'); if(!box) return;
    const ok=await loadMaps();
    if(!ok){ box.innerHTML='<div class="mapmsg">地図を表示できません（APIキー未設定または読込エラー）。<br>座標は「現在地(GPS)で設定」で更新できます。</div>'; return; }
    if($('detailArea').querySelector('#mapBox')!==box) return;   // 詳細が切替わっていたら中止
    const has = pendLat!=null && pendLng!=null;
    const center = has ? {lat:pendLat,lng:pendLng} : DEFAULT_CENTER;
    box.innerHTML='';
    gmap=new google.maps.Map(box,{center, zoom: has?17:12, mapTypeControl:false, streetViewControl:false, fullscreenControl:false, gestureHandling:'greedy', clickableIcons:false});
    gmarker=new google.maps.Marker({position:center, map:gmap, draggable:true});
    gmarker.addListener('dragend', ()=>{ const p=gmarker.getPosition(); setPend(p.lat(),p.lng(),null); toast('地図で位置を指定しました。保存で確定'); });
    gmap.addListener('click', e=>{ gmarker.setPosition(e.latLng); setPend(e.latLng.lat(), e.latLng.lng(), null); });
    if(!has) toast('座標未登録です。地図のピンをドラッグ/タップして位置を指定してください');
  }
  function gpsSetCoord(){
    if(!navigator.geolocation){ toast('この端末はGPS非対応です'); return; }
    toast('現在地を取得中…');
    navigator.geolocation.getCurrentPosition(p=>{
      myPos={lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy};
      setPend(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
      updateGpsDist();
      if(gmap && gmarker){ const pos={lat:pendLat,lng:pendLng}; gmarker.setPosition(pos); gmap.panTo(pos); gmap.setZoom(18); }
      toast(`座標を取得しました（±${Math.round(pendAcc)}m）。保存で確定します`);
    }, e=> toast('現在地の取得に失敗: '+e.message), {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  }
  async function saveEdit(){
    if(saving) return;
    const newKana = $('editKana').value.trim();
    const fix = { busstop_id: current.busstop_id };
    let changed=false;
    if(newKana !== (current.kana||'')){ fix.kana = newKana; changed=true; }
    const coordChanged = pendLat!=null && pendLng!=null && (pendLat!==current.lat || pendLng!==current.lng);
    if(coordChanged){ fix.lat=pendLat; fix.lng=pendLng; changed=true; }
    if(!changed){ toast('変更がありません'); return; }
    saving=true; $('saveBtn').textContent='保存中…';
    try{
      const r=await fetch(`${API_BASE}update_busstops.php`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({secret:CORRECT_SECRET, fixes:[fix]})});
      const j=await r.json().catch(()=>({}));
      if(r.ok && j.updated>=1){
        if('kana' in fix){ current.kana=fix.kana; }
        if(coordChanged){ current.lat=pendLat; current.lng=pendLng; current.has_coord=true; }
        toast('保存しました（DBへ反映）'); refreshCoordDisp(); render();
      } else {
        toast('保存に失敗: '+((j&&j.error)||('HTTP '+r.status)));
      }
    }catch(e){ toast('通信に失敗しました: '+e.message); }
    saving=false; $('saveBtn').textContent='💾 保存（DBへ反映）';
  }
  $('backBtn').addEventListener('click', ()=> show('scList'));

  // ---- モード切替・検索 ----
  $('modeAiu').addEventListener('click', ()=>{ mode='aiu'; $('modeAiu').classList.add('active'); $('modeHere').classList.remove('active'); render(); });
  $('modeHere').addEventListener('click', ()=>{ mode='here'; $('modeHere').classList.add('active'); $('modeAiu').classList.remove('active'); render(); });
  let sT=null; $('searchBox').addEventListener('input', ()=>{ clearTimeout(sT); sT=setTimeout(render, 150); });
  // 左上タイトルで最初の画面へ(五十音・あ行・検索クリア・先頭)
  function goHome(){
    $('searchBox').value=''; mode='aiu'; curRow='あ';
    $('modeAiu').classList.add('active'); $('modeHere').classList.remove('active');
    show('scList'); render(); $('listArea').scrollTop=0; try{ window.scrollTo(0,0); }catch(e){}
  }
  $('homeTitle').addEventListener('click', goHome);

  // ---- オープニング(ドラサポと同様。タップでスタート＋現在地取得) ----
  (function opening(){
    const splash=$('splash'); if(!splash) return;
    let started=false;
    function hideSplash(){ splash.classList.add('hide'); setTimeout(()=>{ if(splash.parentNode) splash.remove(); }, 600); }
    function go(){
      if(started) return; started=true;
      splash.classList.add('play');
      setTimeout(hideSplash, 2200);
      acquireMyPos(ok=>{ if(ok) render(); });   // ユーザー操作時に現在地取得→一覧に距離表示
    }
    ['pointerdown','touchstart','click'].forEach(ev=>{ splash.addEventListener(ev, go); });
    setTimeout(go, 10000);   // 無操作でも進む保険
  })();

  load();
})();
</script>
